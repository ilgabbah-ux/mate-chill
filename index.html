<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#E0408F"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Mate Chill"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"></head><body><title>Mate Chill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: colonna unica stile "diario a quadretti", card adesive con washi tape sulla domanda */
:root{
  --bg:#FFF7FA; --grid:rgba(162,128,214,.13); --card:#FFFFFF; --card2:#FBF5FF;
  --ink:#2B1E3F; --muted:#76698C; --line:#EADCF3;
  --accent:#E0408F; --accent-ink:#FFFFFF; --accent-soft:#FFDCEE;
  --lilac:#B69CFF; --lilac-soft:#EEE6FF; --mint:#7FE3C0; --mint-soft:#DDF8EE; --sun:#FFE27A;
  --good:#17946A; --good-soft:#DBF5EA; --warn:#C27A00; --warn-soft:#FFF0CF; --bad:#D93F57; --bad-soft:#FFE1E6;
  --tape:rgba(255,190,220,.75);
  --shadow:0 1px 0 rgba(60,30,90,.04),0 8px 24px -12px rgba(80,40,120,.25);
  --sea1:#D3F2FF; --sea2:#9FDCF6; --wave:rgba(255,255,255,.55);
  --i-num:#FFE4A6; --i-fra:#FFD3E5; --i-geo:#CDEFCF; --i-ter:#E3D8FF; --rim:#FFF8E4;
  --n-num:#FFB547; --n-fra:#FF6FA8; --n-geo:#38BE78; --n-ter:#8B6CFF; --stone:#E7E2EE; --stone-d:#C9C1D6;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161120; --grid:rgba(182,156,255,.07); --card:#221A31; --card2:#2A2040;
  --ink:#F3EDFF; --muted:#AC9EC6; --line:#3A2E52;
  --accent:#FF6FB4; --accent-ink:#22091A; --accent-soft:#4A2140;
  --lilac:#A48BFF; --lilac-soft:#33285A; --mint:#58D9AE; --mint-soft:#183B33; --sun:#FFD95E;
  --good:#4FD9A0; --good-soft:#163A2E; --warn:#FFC24D; --warn-soft:#3D2E10; --bad:#FF7A8E; --bad-soft:#47202A;
  --tape:rgba(255,111,180,.35); --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;
  --sea1:#0F2740; --sea2:#0A1A2E; --wave:rgba(160,210,255,.10);
  --i-num:#3B331F; --i-fra:#40243A; --i-geo:#1E3B2B; --i-ter:#2D2655; --rim:#4A4560;
  --n-num:#E89A2C; --n-fra:#F0558F; --n-geo:#2BA864; --n-ter:#7B5CF0; --stone:#2E2840; --stone-d:#1E1A2C;
}}
:root[data-theme="dark"]{
  --bg:#161120; --grid:rgba(182,156,255,.07); --card:#221A31; --card2:#2A2040;
  --ink:#F3EDFF; --muted:#AC9EC6; --line:#3A2E52;
  --accent:#FF6FB4; --accent-ink:#22091A; --accent-soft:#4A2140;
  --lilac:#A48BFF; --lilac-soft:#33285A; --mint:#58D9AE; --mint-soft:#183B33; --sun:#FFD95E;
  --good:#4FD9A0; --good-soft:#163A2E; --warn:#FFC24D; --warn-soft:#3D2E10; --bad:#FF7A8E; --bad-soft:#47202A;
  --tape:rgba(255,111,180,.35); --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;
  --sea1:#0F2740; --sea2:#0A1A2E; --wave:rgba(160,210,255,.10);
  --i-num:#3B331F; --i-fra:#40243A; --i-geo:#1E3B2B; --i-ter:#2D2655; --rim:#4A4560;
  --n-num:#E89A2C; --n-fra:#F0558F; --n-geo:#2BA864; --n-ter:#7B5CF0; --stone:#2E2840; --stone-d:#1E1A2C;
}
:root[data-theme="light"][data-palette="matcha"]{--bg:#F3FAF4;--grid:rgba(60,150,100,.11);--card2:#F0FAF3;--ink:#1D2E25;--muted:#5E7568;--line:#D4EBDC;--accent:#2E9466;--accent-soft:#D3F1E1;--lilac:#9FD4B6;--lilac-soft:#E4F5EA;--tape:rgba(160,220,185,.8)}
:root[data-theme="light"][data-palette="pesca"]{--bg:#FFF6F0;--grid:rgba(240,120,70,.11);--card2:#FFF3EB;--ink:#36211A;--muted:#866A5F;--line:#F7DCCD;--accent:#E8592C;--accent-soft:#FFDCCB;--lilac:#FFB38F;--lilac-soft:#FFEADF;--tape:rgba(255,190,150,.8)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;
  -webkit-font-smoothing:antialiased}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 64px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,6vw,2.5rem);font-weight:800}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px;border-radius:12px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.hand{font-family:var(--f-hand);font-size:1.45rem;line-height:1.15}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hl{background:linear-gradient(transparent 58%,var(--accent-soft) 58%,var(--accent-soft) 92%,transparent 92%);padding:0 .1em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:11px 18px;font-weight:700;min-height:48px;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--ink)}
.btn.soft{background:var(--lilac-soft);border-color:transparent;box-shadow:none}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;text-decoration:underline;text-underline-offset:3px;padding-inline:8px}
.btn.big{font-size:1.1rem;padding:14px 22px;min-height:56px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:18px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border:1.5px solid var(--line);border-radius:18px}
.avatar{width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:1.6rem;background:var(--accent-soft);border-radius:14px;border:2px solid var(--card);box-shadow:0 0 0 2px var(--accent);transform:rotate(-4deg)}
.top .who{flex:1;min-width:0}
.top .name{font-weight:800;font-family:var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:8px;border-radius:99px;background:var(--lilac-soft);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lilac),var(--accent));border-radius:99px;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:.85rem;font-weight:700;background:var(--card2);border:1.5px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:1.2rem;flex:none}

/* cards */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);min-width:0}
.hero{position:relative;overflow:hidden;background:var(--card)}
.hero .sticker{position:absolute;right:14px;top:12px;font-size:2.4rem;transform:rotate(10deg)}
.daily{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:74px;height:74px;flex:none;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--lilac-soft) 0);display:grid;place-items:center}
.ring span{width:56px;height:56px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* skills */
.world-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 4px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:128px;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px) rotate(-.4deg);border-color:var(--lilac)}
.tile .em{font-size:1.6rem}
.tile b{font-family:var(--f-display);font-size:1rem;line-height:1.2}
.stars{letter-spacing:2px;font-size:.95rem;color:var(--sun);text-shadow:0 0 1px rgba(120,80,0,.4)}
.stars .off{color:var(--line);text-shadow:none}
.status{align-self:flex-start;margin-top:auto;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px}
.st-new{background:var(--card2);color:var(--muted)}
.st-red{background:var(--bad-soft);color:var(--bad)}
.st-amb{background:var(--warn-soft);color:var(--warn)}
.st-grn{background:var(--good-soft);color:var(--good)}
.st-ter{background:var(--lilac-soft);color:var(--ink)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.78rem;font-weight:600;padding:10px 6px;border-radius:16px;background:var(--card2);border:1.5px dashed var(--line)}
.badge .b{font-size:1.9rem;width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:var(--card);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent-soft)}
.badge.got{border-style:solid;background:var(--card)}
.badge.got:nth-child(odd) .b{transform:rotate(-6deg)}
.badge.got:nth-child(even) .b{transform:rotate(5deg)}
.badge:not(.got){opacity:.55}
.badge:not(.got) .b{filter:grayscale(1)}

/* question */
.qwrap{position:relative;margin-top:14px}
.qcard{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:28px 20px 20px;box-shadow:var(--shadow)}
.qcard::before{content:"";position:absolute;top:-13px;left:50%;width:120px;height:26px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);border-radius:3px;
  background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.35) 6px 12px)}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.qtext{font-size:1.12rem;font-weight:600}
.math{margin:16px 0 4px;padding:18px 12px;border-radius:16px;background:var(--card2);font-family:var(--f-display);font-size:clamp(1.5rem,6.5vw,2.1rem);font-weight:700;text-align:center;overflow-x:auto;font-variant-numeric:tabular-nums;line-height:1.6}
.math .wrong{color:var(--bad);text-decoration:line-through;text-decoration-thickness:3px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 .12em;font-size:.86em}
.fr span:first-child{border-bottom:.09em solid currentColor;padding:0 .18em}
.fr span:last-child{padding:0 .18em}
.qtext .fr{font-size:.95em}
.sq{white-space:nowrap}.sq>span{border-top:.08em solid currentColor;padding:0 .12em;margin-left:.04em}
sup{font-size:.6em;line-height:0}
.var{font-family:Georgia,"Times New Roman",serif;font-style:italic}
.fig{margin:12px auto 0;max-width:320px}
.fig svg{width:100%;height:auto;display:block}
.fig .sh{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.fig .dash{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;fill:none}
.fig text{fill:var(--ink);font:700 14px var(--f-body)}

.answer{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.answer input{flex:1 1 180px;min-width:0;font:700 1.35rem var(--f-display);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.answer input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.keys{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.key{min-width:44px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card2);font-weight:800;font-size:1.1rem}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.choice{min-height:64px;border-radius:16px;border:2px solid var(--line);background:var(--card);font:700 1.25rem var(--f-display);padding:10px;font-variant-numeric:tabular-nums}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.no{border-color:var(--bad);background:var(--bad-soft);opacity:.75}
.choice.yes{border-color:var(--good);background:var(--good-soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions .btn{flex:1 1 auto}

.fb{margin-top:14px;border-radius:16px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.fb:empty{display:none}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--warn-soft);color:var(--warn)}
.fb .e{font-size:1.3rem;line-height:1}
.fb .t{color:var(--ink);font-weight:500}
.fb .t b{font-weight:800}

.hints{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.hint{position:relative;background:var(--sun);color:#3A2A00;border-radius:4px 16px 16px 16px;padding:12px 14px 12px 16px;transform:rotate(-.6deg);box-shadow:0 6px 14px -8px rgba(120,90,0,.5)}
.hint:nth-child(even){transform:rotate(.5deg)}
.hint .lab{font-family:var(--f-hand);font-size:1.35rem;line-height:1;display:block;margin-bottom:4px}
.hint .fr,.hint .sq{color:#3A2A00}
.steps{background:var(--mint-soft);border-radius:16px;padding:14px 16px;border:1.5px dashed var(--mint)}
.steps ol{margin:6px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:1.08rem;font-variant-numeric:tabular-nums}
.steps .lab{font-family:var(--f-hand);font-size:1.4rem;line-height:1}

.progress{display:flex;gap:4px;margin:8px 0 0}
.progress i{flex:1;height:8px;border-radius:99px;background:var(--lilac-soft)}
.progress i.ok{background:var(--good)}
.progress i.help{background:var(--sun)}
.progress i.ko{background:var(--bad)}
.progress i.now{background:var(--accent)}
.combo{font-family:var(--f-hand);font-size:1.5rem;color:var(--accent);line-height:1}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,10,35,.45);display:grid;place-items:end center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{place-items:center}}
.sheet{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--card);border-radius:24px;padding:22px;border:1.5px solid var(--line)}
.toasts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;box-shadow:var(--shadow);animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(12px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.xpfloat{position:absolute;right:20px;top:10px;font-family:var(--f-display);font-weight:800;color:var(--accent);animation:up 1s ease-out forwards;pointer-events:none}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-36px);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25}

/* pickers */
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.pick{height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.6rem}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.theme{border-radius:14px;border:2px solid var(--line);padding:10px;text-align:left;font-weight:700;background:var(--card)}
.theme[aria-pressed="true"]{border-color:var(--accent)}
.sw{display:flex;gap:4px;margin-top:6px}.sw i{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(0,0,0,.12)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700}
.txt{font:600 1.1rem var(--f-body);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
textarea.txt{font:500 .85rem ui-monospace,Menlo,monospace;min-height:90px}

/* results */
.groups{display:grid;gap:12px}
.group{border-radius:18px;padding:14px 16px;border:1.5px solid var(--line);background:var(--card)}
.group h3{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:var(--card2);border:1.5px solid var(--line);font-weight:600;font-size:.9rem}
table.t{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.meter{width:70px;height:7px;border-radius:99px;background:var(--lilac-soft);display:inline-block;vertical-align:middle;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat div{background:var(--card2);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);font-weight:600}
.footer{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ===== gioco ===== */
#app{padding-bottom:110px}
.lvchip{font-size:.75rem;font-weight:800;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:2px}
.pill.coin{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.pill.big{font-size:1rem;padding:7px 14px}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.18)}}
.quest{border:2px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.mission{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.map{position:relative;margin:4px auto 10px;max-width:520px;width:100%}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map path{fill:none;stroke:var(--lilac);stroke-width:7;stroke-linecap:round;stroke-dasharray:1 14;vector-effect:non-scaling-stroke}
.map.fog .node .c{filter:blur(.5px) grayscale(.6);opacity:.55}
.node{position:absolute;transform:translateX(-50%);width:120px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;z-index:1}
.node .c{position:relative;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:var(--card);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .12s}
.node:hover .c{transform:translateY(-2px)}
.node:active .c{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.node .ln{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:800 .78rem/24px var(--f-display);font-style:normal}
.node.done .c{background:var(--accent-soft)}
.node.lock .c{background:var(--card2);border-color:var(--line);box-shadow:0 6px 0 var(--line);font-size:1.3rem}
.node.lock .ln{background:var(--line);color:var(--muted)}
.node.rec .c{background:var(--sun);animation:bob 1.6s ease-in-out infinite;box-shadow:0 6px 0 var(--ink),0 0 0 9px color-mix(in srgb,var(--sun) 35%,transparent)}
@keyframes bob{50%{transform:translateY(-6px)}}
.node .here{position:absolute;top:-34px;font-size:1.5rem;width:40px;height:40px;display:grid;place-items:center;background:var(--card);border:2px solid var(--accent);border-radius:50% 50% 50% 4px;transform:rotate(-8deg);z-index:2}
.node .cap{font-size:.74rem;font-weight:800;background:var(--card);padding:2px 8px;border-radius:99px;border:1.5px solid var(--line);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.node .st{font-size:.9rem;letter-spacing:1px;color:var(--sun);text-shadow:0 0 1px rgba(120,80,0,.6);line-height:1}
.node .st .off,.stars .off{color:var(--line);text-shadow:none}
.node.boss{width:180px}
.node.boss .c{width:92px;height:92px;font-size:2.8rem;background:var(--ink);border-color:var(--ink);box-shadow:0 7px 0 var(--accent)}
.node.boss.lock .c{background:var(--card2);border-color:var(--line);box-shadow:0 7px 0 var(--line);font-size:1.6rem}
.node.boss.done .c{background:var(--good-soft);border-color:var(--good);box-shadow:0 7px 0 var(--good)}
.node.boss .cap{background:var(--ink);color:var(--bg);border-color:var(--ink);max-width:180px}
.node.boss.lock .cap{background:var(--card);color:var(--muted);border-color:var(--line)}
.banner{position:absolute;left:0;right:0;height:96px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;border:2px solid var(--ink);background:var(--card);box-shadow:0 5px 0 var(--ink);z-index:1}
.banner .bem{font-size:2.2rem;width:56px;height:56px;display:grid;place-items:center;border-radius:16px;background:var(--lilac-soft);flex:none}
.banner div{flex:1;min-width:0;display:flex;flex-direction:column}
.banner b{font-family:var(--f-display);font-size:1.15rem;line-height:1.15}
.banner div span{font-size:.85rem;color:var(--muted)}
.b-fra .bem{background:var(--accent-soft)}.b-geo .bem{background:var(--mint-soft)}.b-ter .bem{background:var(--warn-soft)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;gap:4px;padding:6px;border-radius:22px;background:var(--ink);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:0;min-width:76px;padding:6px 10px;border:0;border-radius:16px;background:transparent;color:var(--bg);font-size:1.3rem}
.dock button span{font-size:.7rem;font-weight:700}
.dock button.on{background:color-mix(in srgb,var(--bg) 18%,transparent)}
.lvtitle{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bosscard{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:var(--ink);color:var(--bg)}
.bossem{font-size:3rem;line-height:1;display:inline-block}
.bossinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bossinfo b{font-family:var(--f-display);font-size:1.1rem}
.bossinfo .hand{font-size:1.2rem;color:var(--sun)}
.hp{height:14px;border-radius:99px;background:color-mix(in srgb,var(--bg) 22%,transparent);overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--accent));border-radius:99px;transition:width .5s}
.hit{animation:hit .45s}
@keyframes hit{20%{transform:translateX(-8px) rotate(-10deg) scale(.9);filter:brightness(2)}60%{transform:translateX(6px) rotate(6deg)}}
.xpfloat.dmg{left:30px;right:auto;top:0;color:var(--sun);font-size:1.6rem}
.xpfloat.boss{left:60px;right:auto;top:0;color:var(--bg);font-family:var(--f-hand);font-size:1.4rem}
.pet{display:flex;align-items:flex-end;gap:10px;margin-top:4px}
.petem{font-size:2.6rem;line-height:1;display:inline-block}
.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-14px) rotate(-8deg)}}
.bubble{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;font-family:var(--f-hand);font-size:1.3rem;line-height:1.2;box-shadow:var(--shadow)}
.resultcard{text-align:center;align-items:center}
.bigstars{display:flex;gap:6px;justify-content:center}
.bigstars span{font-size:3.6rem;color:var(--line);line-height:1}
.bigstars span.on{color:var(--sun);text-shadow:0 3px 0 rgba(150,100,0,.35);animation:starpop .5s both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}to{transform:none}}
.tabs{display:flex;gap:6px;background:var(--card2);padding:5px;border-radius:16px}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px;font-weight:800}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:var(--shadow)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);text-align:center}
.item.eq{border:2px solid var(--accent)}
.item .iv{font-size:2.4rem;line-height:1.1;min-height:48px;display:grid;place-items:center}
.item .btn{min-height:40px;padding:6px 14px;width:100%}
.item .sw i{width:24px;height:24px}
.lvrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;border:2px solid var(--line);background:var(--card)}
.lvbtn.sel{border-color:var(--accent);background:var(--accent-soft)}
.lvbtn.lock{opacity:.5}
.lvbtn small{color:var(--muted);font-weight:600}
.lvbtn .stars{font-size:1rem}
details.steps summary{cursor:pointer}
.btn.danger{border-color:var(--bad);color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.ph{width:1.3em;height:1.3em;border-radius:50%;object-fit:cover;vertical-align:middle;display:inline-block}
.avatar .ph,.node .here .ph{width:100%;height:100%;border-radius:inherit}
.avatar{overflow:hidden;padding:0}
.node .here{overflow:hidden;padding:0}
.pick .ph{width:42px;height:42px;border-radius:11px}
.item .iv .ph{width:76px;height:76px;border:3px solid #fff;box-shadow:0 6px 14px -6px rgba(0,0,0,.45);transform:rotate(-3deg)}
.ph.big{width:68px;height:68px;border:3px solid #fff;box-shadow:0 6px 14px -6px rgba(0,0,0,.45);transform:rotate(-5deg)}
.ph.mini{width:30px;height:30px;border:2px solid #fff;margin-right:2px;vertical-align:-8px}
.duo{position:absolute;right:10px;top:10px;display:flex}
.duo .ph{width:74px;height:74px;border:4px solid #fff;box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
.duo .st1{transform:rotate(-8deg);position:relative;z-index:1}
.duo .st2{transform:rotate(7deg);margin-left:-18px;margin-top:22px}
.hero h1{padding-right:112px}
/* ===== grafica v2 ===== */
.map{background:radial-gradient(120% 60% at 50% 0%,var(--sea1),var(--sea2));border-radius:34px;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent),0 18px 40px -24px rgba(30,60,120,.5);overflow:hidden;
  background-image:radial-gradient(circle at 20% 30%,var(--wave) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,var(--wave) 0 2px,transparent 3px),radial-gradient(120% 60% at 50% 0%,var(--sea1),var(--sea2));background-size:46px 46px,58px 58px,100% 100%}
.map::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(ellipse at 50% -20%,transparent 0 38px,var(--wave) 39px 41px,transparent 42px 80px);opacity:.5;pointer-events:none}
.island{position:absolute;left:6%;right:6%;border-radius:46% 54% 42% 58% / 6% 5% 7% 6%;box-shadow:0 0 0 10px var(--rim),0 0 0 22px color-mix(in srgb,var(--rim) 35%,transparent),0 30px 50px -20px rgba(0,40,90,.35);pointer-events:none}
.island::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(70% 30% at 30% 20%,rgba(255,255,255,.35),transparent 70%),radial-gradient(60% 25% at 75% 70%,rgba(0,0,0,.06),transparent 70%)}
.i-num{background:var(--i-num)}.i-fra{background:var(--i-fra)}.i-geo{background:var(--i-geo)}
.i-ter{background:radial-gradient(60% 40% at 50% 40%,color-mix(in srgb,var(--n-ter) 30%,var(--i-ter)),var(--i-ter))}
.deco{position:absolute;transform:translateX(-50%);font-size:1.9rem;z-index:1;pointer-events:none;filter:drop-shadow(0 4px 2px rgba(0,0,0,.15));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateX(-50%) translateY(-6px) rotate(4deg)}}
.cloud{position:absolute;z-index:0;width:140px;height:44px;border-radius:99px;background:rgba(255,255,255,.85);filter:blur(1px);pointer-events:none;animation:drift 38s linear infinite;opacity:.85}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:60px;height:60px;left:22px;top:-28px}.cloud::after{width:46px;height:46px;left:70px;top:-18px}
.cloud.c1{top:240px;left:-160px}.cloud.c2{top:1500px;left:-160px;animation-delay:-14s;transform:scale(.8)}.cloud.c3{top:2900px;left:-160px;animation-delay:-26s}
@keyframes drift{to{left:110%}}
:root[data-theme="dark"] .cloud{background:rgba(200,210,255,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cloud{background:rgba(200,210,255,.12)}}
.map.fog .cloud{opacity:1;z-index:5}
.map.fog::after{content:"";position:absolute;inset:0;z-index:4;background:linear-gradient(transparent 0,color-mix(in srgb,var(--bg) 70%,transparent) 260px);backdrop-filter:blur(3px);pointer-events:none}
.banner{left:5%;right:5%;height:84px;padding:10px 12px;gap:10px;border-radius:20px;background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 85%,var(--sun)));transform:rotate(-1deg)}
.banner::before,.banner::after{content:"";position:absolute;top:22px;width:22px;height:40px;background:var(--accent);z-index:-1}
.banner::before{left:-14px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}.banner::after{right:-14px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.node{--c:var(--n-num)}.node.w-fra{--c:var(--n-fra)}.node.w-geo{--c:var(--n-geo)}.node.w-ter{--c:var(--n-ter)}
.node .c{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.95) 0 14%,transparent 15%),linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,#fff),var(--card));border:3px solid var(--ink);box-shadow:0 7px 0 var(--ink),inset 0 -6px 0 color-mix(in srgb,var(--c) 35%,transparent)}
.node.done .c{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.75) 0 13%,transparent 14%),linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 7px 0 var(--ink),inset 0 -7px 0 rgba(0,0,0,.18)}
.node.lock .c{background:linear-gradient(180deg,var(--stone),var(--stone-d));border-color:color-mix(in srgb,var(--ink) 25%,transparent);box-shadow:0 7px 0 color-mix(in srgb,var(--ink) 25%,transparent);filter:none}
.node.rec .c{background:radial-gradient(circle at 35% 28%,#fff 0 14%,transparent 15%),linear-gradient(180deg,#FFF3B0,var(--sun))}
.node.rec::before{content:"";position:absolute;top:-14px;width:96px;height:96px;border-radius:50%;background:conic-gradient(from 0deg,transparent,color-mix(in srgb,var(--sun) 70%,transparent),transparent 40%);animation:spin 3s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.node .st{background:var(--ink);padding:2px 7px;border-radius:99px;font-size:.78rem}
.node .st .off{color:color-mix(in srgb,var(--bg) 35%,transparent)}
.node .cap{box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 15%,transparent)}
.node.boss .c{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 60%,#000),#120a1e);border:4px solid var(--c);box-shadow:0 8px 0 #000,0 0 0 8px color-mix(in srgb,var(--c) 30%,transparent),0 0 34px color-mix(in srgb,var(--c) 70%,transparent)}
.node.boss.lock .c{background:linear-gradient(180deg,var(--stone),var(--stone-d));border-color:var(--stone-d);box-shadow:0 8px 0 color-mix(in srgb,var(--ink) 25%,transparent)}
.map path{stroke:#fff;stroke-width:9;stroke-dasharray:1 16;opacity:.95;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
/* sfondo per isola durante il gioco */
body[data-world="num"]{background:linear-gradient(180deg,var(--i-num) 0,color-mix(in srgb,var(--i-num) 45%,var(--bg)) 55%,var(--bg))}
body[data-world="fra"]{background:linear-gradient(180deg,var(--i-fra) 0,color-mix(in srgb,var(--i-fra) 45%,var(--bg)) 55%,var(--bg))}
body[data-world="geo"]{background:linear-gradient(180deg,var(--i-geo) 0,color-mix(in srgb,var(--i-geo) 45%,var(--bg)) 55%,var(--bg))}
body[data-world="ter"]{background:linear-gradient(180deg,var(--i-ter) 0,color-mix(in srgb,var(--i-ter) 45%,var(--bg)) 55%,var(--bg))}
.qcard{border:2px solid color-mix(in srgb,var(--ink) 14%,transparent);box-shadow:0 6px 0 color-mix(in srgb,var(--ink) 12%,transparent),var(--shadow)}
.bosscard{overflow:hidden;background:radial-gradient(120% 140% at 15% 50%,#3a1f5c,#140b22 70%);color:#fff;border:3px solid #000;box-shadow:0 6px 0 #000}
.bosscard .aura{position:absolute;left:-30px;top:50%;width:150px;height:150px;transform:translateY(-50%);border-radius:50%;background:conic-gradient(from 0deg,#ff4fa0,#7b5cff,#36d6ff,#ff4fa0);filter:blur(22px);opacity:.55;animation:spin 6s linear infinite}
.bossem{position:relative;font-size:3.6rem;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5));animation:bossidle 2.2s ease-in-out infinite}
@keyframes bossidle{50%{transform:translateY(-5px) scale(1.04)}}
.bossinfo{position:relative}
.hp{border:2px solid #000;height:16px;background:#2a1a3a}
.hp i{background:linear-gradient(180deg,#ff8aa0,#e8344f);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.resultcard{position:relative;overflow:hidden}
.banner .bem{width:48px;height:48px;font-size:1.8rem}
.banner b{font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}
.banner .pill{padding:3px 8px;font-size:.78rem}
.resultcard::before{content:"";position:absolute;left:50%;top:-140px;width:520px;height:520px;margin-left:-260px;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--sun) 30%,transparent) 0 10deg,transparent 10deg 20deg);animation:spin 18s linear infinite;pointer-events:none;mask-image:radial-gradient(circle,#000 30%,transparent 65%);-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 65%)}
.resultcard>*{position:relative}
.pill.coin{background:linear-gradient(180deg,#FFE58A,#FFC53D);color:#3A2600;border:2px solid #C98A00;box-shadow:0 2px 0 #C98A00}
.top{border:2px solid color-mix(in srgb,var(--ink) 12%,transparent);box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 10%,transparent)}
.dock{background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(8px);border:2px solid color-mix(in srgb,var(--bg) 20%,transparent)}
.bimg{display:block;width:100%;height:100%;object-fit:contain}
.node.boss .c{overflow:visible}
.node.boss .c .bimg{width:132%;height:132%;margin-top:-22%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.bossem{width:96px;height:96px;flex:none;font-size:0}
.bosshero{width:190px;height:190px;margin:0 auto;animation:bossidle 2.2s ease-in-out infinite;filter:drop-shadow(0 12px 14px rgba(40,0,80,.3))}
.bosshero.small{width:150px;height:150px}
/* ===== gioco a piattaforme ===== */
.game{position:fixed;inset:0;z-index:15;background:#7FD3FF;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gtop{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;align-items:center;gap:10px;z-index:2}
.gbtn{width:44px;height:44px;border-radius:14px;border:2px solid #2B1E3F;background:#fff;color:#2B1E3F;font:800 1.2rem var(--f-display);box-shadow:0 3px 0 #2B1E3F;flex:none}
.gdots{flex:1;display:flex;gap:4px}
.gdots i{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.6);border:1.5px solid rgba(43,30,63,.25)}
.gdots i.now{background:#FFE27A}.gdots i.ok{background:#3DBE78}.gdots i.help{background:#FFC24D}.gdots i.ko{background:#FF7A8E}
.gboss{position:absolute;right:150px;left:12px;top:calc(62px + env(safe-area-inset-top,0px));z-index:2;color:#fff;text-shadow:0 2px 0 #2B1E3F;font-family:var(--f-display)}
.gboss .hp{margin-top:4px;max-width:220px}
.gq{position:absolute;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top,0px));z-index:2;background:rgba(255,255,255,.94);color:#2B1E3F;border:2.5px solid #2B1E3F;border-radius:20px;padding:10px 14px;box-shadow:0 5px 0 rgba(43,30,63,.35);max-width:620px;margin:0 auto}
.game .gboss~.gq{top:calc(118px + env(safe-area-inset-top,0px));right:150px}
.gqmeta{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#76698C}
.gq p{font-weight:700;font-size:1rem;line-height:1.3;margin-top:2px}
.gmath{font:800 clamp(1.3rem,6vw,1.8rem)/1.5 var(--f-display);text-align:center;font-variant-numeric:tabular-nums}
.gfig{max-width:190px;margin:2px auto 0}.gfig svg{width:100%;height:auto;display:block}
.gfig .sh{fill:#FFDCEE;stroke:#2B1E3F;stroke-width:2.2}.gfig .dash{stroke:#E0408F;stroke-width:2;stroke-dasharray:5 4;fill:none}.gfig text{fill:#2B1E3F;font:700 14px var(--f-body)}
.gdone{text-align:center;font:800 1.15rem var(--f-display)!important}
.gbottom{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:stretch;z-index:2;background:linear-gradient(transparent,rgba(43,30,63,.35))}
.gchoices{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gchoice{min-height:54px;border-radius:16px;border:2.5px solid #2B1E3F;background:linear-gradient(#fff,#F1EAFB);color:#2B1E3F;font:800 1.2rem var(--f-display);box-shadow:0 4px 0 #2B1E3F;padding:4px;font-variant-numeric:tabular-nums}
.gchoice:disabled{opacity:.45;box-shadow:none;transform:translateY(3px)}
.gchoice .fr{font-size:.85em}
.ghintb{height:auto;width:56px;background:#FFE27A}
.gmsg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.8);opacity:0;z-index:3;max-width:min(90vw,440px);padding:12px 18px;border-radius:18px;font-weight:700;text-align:center;border:2.5px solid #2B1E3F;background:#fff;color:#2B1E3F;transition:.2s;pointer-events:none}
.gmsg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.gmsg.good{background:#DBF5EA}.gmsg.bad{background:#FFE1E6}
.ghints{position:absolute;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:4;max-height:55%;overflow:auto;background:#fff;color:#2B1E3F;border:2.5px solid #2B1E3F;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);max-width:620px;margin:0 auto}
.ghints .hint{color:#3A2A00}.ghints .steps{color:#2B1E3F}

</style>
<main id="app" aria-live="off"></main>
<div id="toasts" class="toasts" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
/* ===== Mate Chill — generatori di esercizi ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>a/gcd(a,b)*b;
const fr=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;return d===1?n:{n,d}};
const val=x=>typeof x==='number'?x:x.n/x.d;
const rnd=x=>+(+x).toFixed(8);
const num=x=>{const s=(+(+x).toFixed(6)).toString();return s.replace('.',',').replace('-','−')};
const F=(n,d)=>`<span class="fr"><span>${num(n)}</span><span>${num(d)}</span></span>`;
const fmt=x=>typeof x==='number'?num(x):(x.n<0?'−':'')+F(Math.abs(x.n),x.d);
const P=(b,e)=>`${b}<sup>${e}</sup>`;
const sg=n=>n<0?`(−${-n})`:`(+${n})`;
const SQ=n=>`<span class="sq">√<span>${n}</span></span>`;
const X='<i class="var">x</i>';
const NAMES=['Giulia','Sofia','Aurora','Emma','Alice','Greta','Matilde','Bea','Leo','Marco','Tommaso','Nina'];
function factor(n){const f={};let d=2;while(n>1){while(n%d===0){f[d]=(f[d]||0)+1;n/=d}d++}return f}
const fstr=n=>Object.entries(factor(n)).map(([p,e])=>e>1?P(p,e):p).join(' · ');

/* ---------- SVG figure ---------- */
function fig(type,L){
  const t=(x,y,s,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}">${s}</text>`;
  const shape=(pts)=>`<polygon points="${pts}" class="sh"/>`;
  const dash=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="dash"/>`;
  let g='';
  if(type==='rect'){g=`<rect x="50" y="20" width="160" height="90" class="sh"/>`+t(130,132,L.b)+t(222,70,L.h,'start')}
  if(type==='square'){g=`<rect x="80" y="15" width="100" height="100" class="sh"/>`+t(130,135,L.l)}
  if(type==='tri'){g=shape('30,115 220,115 150,18')+dash(150,18,150,115)+t(125,135,L.b)+t(156,75,L.h,'start')}
  if(type==='para'){g=shape('20,115 180,115 230,20 70,20')+dash(70,20,70,115)+t(100,135,L.b)+t(76,75,L.h,'start')}
  if(type==='rombo'){g=shape('130,8 225,68 130,128 35,68')+dash(35,68,225,68)+dash(130,8,130,128)+t(180,62,L.D)+t(137,105,L.d,'start')}
  if(type==='trap'){g=shape('20,115 240,115 180,25 75,25')+dash(75,25,75,115)+t(130,135,L.B)+t(128,18,L.b)+t(81,75,L.h,'start')}
  if(type==='rt'){g=shape('40,115 210,115 40,20')+`<polyline points="40,100 55,100 55,115" class="dash" style="stroke-dasharray:none"/>`+t(125,135,L.a)+t(32,72,L.b,'end')+t(135,58,L.c,'start')}
  return `<svg viewBox="0 0 260 145" role="img" aria-label="figura">${g}</svg>`;
}

const G={};

/* 1. Calcolo veloce */
G.calcolo=L=>{
  if(L===1){const a=R(3,9),b=R(3,9);
    if(Math.random()<.5){const h2=b%2===0?`${a} × ${b} = (${a} × ${b/2}) × 2 = ${a*b/2} × 2`:`${a} × ${b} = ${a} × ${b-1} + ${a} = ${a*(b-1)} + ${a}`;
      return{text:'Calcola a mente.',math:`${a} × ${b}`,ans:a*b,traps:[{v:a+b,msg:'Hai sommato: qui serve la moltiplicazione.'}],h1:'Le tabelline! Se non te la ricordi, spezzala in pezzi più facili.',h2,steps:[h2+` = ${a*b}`]}}
    const p=a*b;return{text:'Calcola a mente.',math:`${p} : ${a}`,ans:b,h1:'La divisione è l’inverso della moltiplicazione.',h2:`Cerca il numero che moltiplicato per ${a} dà ${p}: ${a} × ? = ${p}`,steps:[`${a} × ${b} = ${p}`,`quindi ${p} : ${a} = ${b}`]}}
  if(L===2){
    if(Math.random()<.5){let a;do{a=R(12,49)}while(a%10===0);const b=R(3,9),T=a-a%10,U=a%10;
      return{text:'Calcola (puoi usare carta e penna).',math:`${a} × ${b}`,ans:a*b,traps:[{v:T*b+U,msg:'Ricordati di moltiplicare anche le unità!'}],h1:'Spezza il numero grande in decine e unità.',h2:`${a} × ${b} = ${T} × ${b} + ${U} × ${b}`,steps:[`${T} × ${b} = ${T*b}`,`${U} × ${b} = ${U*b}`,`${T*b} + ${U*b} = ${a*b}`]}}
    const d=R(3,9);let q;do{q=R(21,99)}while(q%10===0);const p=d*q,Tq=q-q%10,Uq=q%10;
    return{text:'Calcola (puoi usare carta e penna).',math:`${p} : ${d}`,ans:q,h1:'Spezza il dividendo in parti che si dividono facilmente.',h2:`${p} = ${d*Tq} + ${d*Uq}`,steps:[`${d*Tq} : ${d} = ${Tq}`,`${d*Uq} : ${d} = ${Uq}`,`${Tq} + ${Uq} = ${q}`]}}
  if(Math.random()<.5){const a=R(12,39);let b;do{b=R(11,25)}while(b%10===0);const bt=b-b%10,bu=b%10;
    return{text:'Calcola (carta e penna ok).',math:`${a} × ${b}`,ans:a*b,traps:[{v:a*bt+bu,msg:'Hai moltiplicato solo per le decine: manca '+a+' × '+bu+'.'}],h1:'Spezza il secondo numero: decine + unità.',h2:`${a} × ${b} = ${a} × ${bt} + ${a} × ${bu}`,steps:[`${a} × ${bt} = ${a*bt}`,`${a} × ${bu} = ${a*bu}`,`${a*bt} + ${a*bu} = ${a*b}`]}}
  const d=R(11,25),q=R(4,19),p=d*q;
  return{text:'Calcola (carta e penna ok).',math:`${p} : ${d}`,ans:q,h1:'Stima: quante volte ci sta il divisore nel dividendo?',h2:`Parti da qui: ${d} × 10 = ${d*10}. Ti serve di più o di meno?`,steps:[`${d} × ${q} = ${p}`,`quindi ${p} : ${d} = ${q}`]}};

/* 2. Decimali */
G.decimali=L=>{
  if(L===1){
    if(Math.random()<.5){const A=R(11,99),B=R(11,99);return{text:'Calcola.',math:`${num(A/10)} + ${num(B/10)}`,ans:rnd((A+B)/10),h1:'Metti in colonna: virgola sotto virgola.',h2:`Pensa in decimi: ${A} decimi + ${B} decimi.`,steps:[`${A} + ${B} = ${A+B} decimi`,`${A+B} decimi = ${num((A+B)/10)}`]}}
    const x=R(101,999)/100,k=pick([10,100]);return{text:'Calcola.',math:`${num(x)} × ${k}`,ans:rnd(x*k),traps:[{v:rnd(x/k),msg:'Moltiplicando il numero diventa più grande: la virgola va a destra.'}],h1:'Per moltiplicare per 10, 100, 1000 sposti la virgola a destra di 1, 2, 3 posti.',h2:`Moltiplica per ${k}: sposta la virgola di ${k===10?1:2} ${k===10?'posto':'posti'} a destra.`,steps:[`${num(x)} × ${k} = ${num(x*k)}`]}}
  if(L===2){
    if(Math.random()<.5){const a=R(3,9),B=R(101,a*100-1);return{text:'Calcola.',math:`${a} − ${num(B/100)}`,ans:rnd((a*100-B)/100),h1:'Incolonna le virgole. Se mancano cifre aggiungi gli zeri.',h2:`Scrivi ${a} come ${a},00`,steps:[`${a},00 − ${num(B/100)}`,`${a*100} − ${B} = ${a*100-B} centesimi`,`= ${num((a*100-B)/100)}`]}}
    const x=R(11,999)/10,k=pick([10,100,1000]),p=String(k).length-1;return{text:'Calcola.',math:`${num(x)} : ${k}`,ans:rnd(x/k),traps:[{v:rnd(x*k),msg:'Dividendo il numero diventa più piccolo: la virgola va a sinistra.'}],h1:'Per dividere per 10, 100, 1000 sposti la virgola a sinistra (aggiungi zeri se servono).',h2:`Dividi per ${k}: sposta la virgola di ${p} ${p===1?'posto':'posti'} a sinistra.`,steps:[`${num(x)} : ${k} = ${num(x/k)}`]}}
  const A=Math.random()<.5?R(2,9):R(11,35),B=R(2,9);
  return{text:'Calcola.',math:`${num(A/10)} × ${num(B/10)}`,ans:rnd(A*B/100),traps:[{v:rnd(A*B/10),msg:'Conta i decimali: in tutto i fattori hanno 2 cifre dopo la virgola.'}],h1:'Moltiplica come se non ci fossero le virgole, poi metti tante cifre decimali quante ce ne sono in tutto nei fattori.',h2:`${A} × ${B} = ${A*B}. Quante cifre decimali in tutto?`,steps:[`${A} × ${B} = ${A*B}`,`1 decimale + 1 decimale = 2 decimali`,`→ ${num(A*B/100)}`]}};

/* 3. Frazioni: le basi */
G.frazioni=L=>{
  if(L===1){const d=R(2,8),n=R(1,d-1),k=R(2,9),N=d*k;const fz=F(n,d);
    const text=pick([`Quanto sono i ${fz} di ${N}?`,`Una playlist ha ${N} canzoni e i ${fz} sono pop. Quante sono le canzoni pop?`,`${pick(NAMES)} ha ${N} € e ne spende i ${fz}. Quanti euro spende?`]);
    const traps=n>1?[{v:k,msg:`Hai trovato solo 1/${d}: ora moltiplica per ${n}.`}]:[];
    return{text,ans:n*k,traps,h1:'Frazione di un numero: dividi per il denominatore, poi moltiplica per il numeratore.',h2:`Prima: ${N} : ${d} = ?`,steps:[`${N} : ${d} = ${k}`,`${k} × ${n} = ${n*k}`]}}
  if(L===2){let a,b;do{b=R(2,9);a=R(1,b-1)}while(gcd(a,b)!==1);const k=R(2,9);
    return{text:'Semplifica la frazione il più possibile (riducila ai minimi termini).',math:F(a*k,b*k),eq:true,ans:fr(a,b),req:'simple',ph:'es. 3/4',h1:'Dividi numeratore e denominatore per lo stesso numero, finché non hanno più divisori in comune.',h2:`Sono tutti e due divisibili per ${k}.`,steps:[`${a*k} : ${k} = ${a}`,`${b*k} : ${k} = ${b}`,`${F(a*k,b*k)} = ${F(a,b)}`]}}
  const dens=[3,4,5,6,8,10,12];let fs;
  do{fs=[0,1,2].map(()=>{const d=pick(dens);return[R(1,d-1),d]})}while(new Set(fs.map(f=>f[0]/f[1])).size<3);
  const vals=fs.map(f=>f[0]/f[1]),best=vals.indexOf(Math.max(...vals)),M=fs.reduce((m,f)=>lcm(m,f[1]),1);
  return{text:'Qual è la frazione più grande?',choices:fs.map(f=>F(f[0],f[1])),correct:best,ans:fs[best][0]/fs[best][1],h1:'Per confrontare le frazioni portale allo stesso denominatore: vince il numeratore più grande.',h2:`Il denominatore comune è ${M}.`,steps:fs.map(f=>`${F(f[0],f[1])} = ${F(f[0]*M/f[1],M)}`).concat([`La più grande è ${F(fs[best][0],fs[best][1])}`])}};

/* 4. Operazioni con le frazioni */
G.frazop=L=>{
  if(L===1){const d=R(3,12);let a=R(1,d-1),b=R(1,d-1);const sub=Math.random()<.35&&a!==b;if(sub&&a<b)[a,b]=[b,a];
    const res=sub?a-b:a+b,ans=fr(res,d);const st=[`${F(a,d)} ${sub?'−':'+'} ${F(b,d)} = ${F(res,d)}`];if(typeof ans!=='number'?ans.d!==d:true)st.push(`= ${fmt(ans)} (semplificata)`);
    return{text:'Calcola.',math:`${F(a,d)} ${sub?'−':'+'} ${F(b,d)}`,ans,ph:'es. 5/7',traps:sub?[]:[{v:(a+b)/(2*d),msg:'Il denominatore resta lo stesso: si sommano solo i numeratori.'}],h1:'Stesso denominatore: fai il calcolo sui numeratori, il denominatore resta uguale.',h2:`${a} ${sub?'−':'+'} ${b} = ${res}`,steps:st}}
  if(L===2){let b,d;do{b=R(2,9);d=R(2,9)}while(b===d);let a=R(1,b-1),c=R(1,d-1);let sub=Math.random()<.4;if(sub&&a/b<c/d){[a,b,c,d]=[c,d,a,b]}if(sub&&a/b===c/d)sub=false;
    const M=lcm(b,d),A=a*M/b,C=c*M/d,res=sub?A-C:A+C,ans=fr(res,M),op=sub?'−':'+';
    const st=[`mcm(${b}, ${d}) = ${M}`,`${F(A,M)} ${op} ${F(C,M)} = ${F(res,M)}`];if(typeof ans==='number'||ans.d!==M)st.push(`= ${fmt(ans)}`);
    return{text:'Calcola e semplifica il risultato.',math:`${F(a,b)} ${op} ${F(c,d)}`,ans,ph:'es. 7/12',traps:sub?[]:[{v:(a+c)/(b+d),msg:'I denominatori non si sommano: serve un denominatore comune (il mcm).'}],h1:'Denominatori diversi: trova il denominatore comune (mcm), trasforma le frazioni, poi calcola i numeratori.',h2:`Il denominatore comune è ${M}: ${F(a,b)} = ${F(A,M)} e ${F(c,d)} = ${F(C,M)}`,steps:st}}
  let a,b,c,d;do{a=R(1,9);b=R(2,9);c=R(1,9);d=R(2,9)}while(a===b||c===d||c===d*d/ (d||1)&&false||(a*d)/(b*c)===(a*c)/(b*d));
  if(Math.random()<.5){const ans=fr(a*c,b*d);return{text:'Calcola e semplifica.',math:`${F(a,b)} × ${F(c,d)}`,ans,ph:'es. 2/5',h1:'Moltiplicazione: numeratore per numeratore, denominatore per denominatore (se puoi, semplifica prima in croce).',h2:`Numeratore: ${a} × ${c}. Denominatore: ${b} × ${d}.`,steps:[`= ${F(a*c,b*d)}`,`= ${fmt(ans)}`]}}
  const ans=fr(a*d,b*c);return{text:'Calcola e semplifica.',math:`${F(a,b)} : ${F(c,d)}`,ans,ph:'es. 3/2',traps:[{v:(a*c)/(b*d),msg:'Nella divisione si moltiplica per il RECIPROCO della seconda frazione (la giri sottosopra).'}],h1:'Divisione tra frazioni: la prima resta uguale, la seconda si capovolge e si moltiplica.',h2:`${F(a,b)} : ${F(c,d)} = ${F(a,b)} × ${F(d,c)}`,steps:[`${F(a,b)} × ${F(d,c)} = ${F(a*d,b*c)}`,`= ${fmt(ans)}`]}};

/* 5. Potenze */
G.potenze=L=>{
  if(L===1){const [b,e]=pick([[2,R(2,6)],[3,R(2,4)],[4,R(2,3)],[5,R(2,3)],[10,R(2,5)],[R(6,12),2],[R(2,9),0],[R(2,20),1]]);const ans=b**e;
    const traps=[];if(b*e!==ans)traps.push({v:b*e,msg:`La potenza non è base × esponente: ${P(b,e)} vuol dire ${b} moltiplicato per sé stesso ${e} volte.`});if(e===0)traps.push({v:0,msg:'Ogni numero (diverso da 0) elevato alla 0 fa 1!'});
    const steps=e===0?[`${P(b,0)} = 1 (regola)`]:e===1?[`${P(b,1)} = ${b}`]:[`${P(b,e)} = ${Array(e).fill(b).join(' × ')} = ${ans}`];
    return{text:'Calcola la potenza.',math:P(b,e),ans,traps,h1:'bⁿ vuol dire moltiplicare la base b per sé stessa n volte. Attenzione: b⁰ = 1 e b¹ = b.',h2:e>1?`Scrivi ${Array(e).fill(b).join(' × ')}`:'Ricorda le due regole speciali: esponente 0 e esponente 1.',steps}}
  if(L===2){const a=R(2,9),t=R(0,2);
    if(t===0){const m=R(2,8),n=R(2,8);return{text:'Scrivi come un’unica potenza. Qual è l’esponente?',math:`${P(a,m)} · ${P(a,n)} = ${P(a,'?')}`,eq:false,ans:m+n,ph:'esponente',traps:m*n!==m+n?[{v:m*n,msg:'Stessa base e moltiplicazione: gli esponenti si SOMMANO, non si moltiplicano.'}]:[],h1:'Prodotto di potenze con la stessa base: la base resta, gli esponenti si sommano.',h2:`${m} + ${n} = ?`,steps:[`${P(a,m)} · ${P(a,n)} = ${P(a,m+n)}`]}}
    if(t===1){const n=R(2,6),m=n+R(1,6);const tr=[];if(m%n===0&&m/n!==m-n)tr.push({v:m/n,msg:'Divisione con stessa base: gli esponenti si SOTTRAGGONO.'});return{text:'Scrivi come un’unica potenza. Qual è l’esponente?',math:`${P(a,m)} : ${P(a,n)} = ${P(a,'?')}`,eq:false,ans:m-n,ph:'esponente',traps:tr,h1:'Quoziente di potenze con la stessa base: la base resta, gli esponenti si sottraggono.',h2:`${m} − ${n} = ?`,steps:[`${P(a,m)} : ${P(a,n)} = ${P(a,m-n)}`]}}
    const m=R(2,5),n=R(2,4);return{text:'Scrivi come un’unica potenza. Qual è l’esponente?',math:`(${P(a,m)})${'<sup>'+n+'</sup>'} = ${P(a,'?')}`,eq:false,ans:m*n,ph:'esponente',traps:m+n!==m*n?[{v:m+n,msg:'Potenza di potenza: gli esponenti si MOLTIPLICANO.'}]:[],h1:'Potenza di una potenza: la base resta, gli esponenti si moltiplicano.',h2:`${m} × ${n} = ?`,steps:[`(${P(a,m)})<sup>${n}</sup> = ${P(a,m*n)}`]}}
  const a=pick([2,2,3]),r=a===2?R(1,4):R(1,3),m=R(3,7),n=R(2,5),k=m+n-r;
  return{text:'Usa le proprietà delle potenze e calcola il valore.',math:`${P(a,m)} · ${P(a,n)} : ${P(a,k)}`,ans:a**r,traps:a**r!==r?[{v:r,msg:`Hai trovato l’esponente (${r}): ora calcola quanto vale ${P(a,r)}.`}]:[],h1:'Prima sommi gli esponenti della moltiplicazione, poi sottrai quello della divisione. Alla fine calcoli la potenza.',h2:`${P(a,m)} · ${P(a,n)} = ${P(a,m+n)}`,steps:[`${P(a,m)} · ${P(a,n)} = ${P(a,m+n)}`,`${P(a,m+n)} : ${P(a,k)} = ${P(a,r)}`,`${P(a,r)} = ${a**r}`]}};

/* 6. Espressioni */
G.espressioni=L=>{
  const H1='Ordine delle operazioni: prima le parentesi, poi potenze, poi × e :, infine + e −.';
  if(L===1){const t=R(0,2);
    if(t===0){const a=R(2,20),b=R(2,9),c=R(2,9);return{text:'Calcola l’espressione.',math:`${a} + ${b} × ${c}`,ans:a+b*c,traps:[{v:(a+b)*c,msg:'Prima la moltiplicazione, poi l’addizione!'}],h1:H1,h2:`Parti da ${b} × ${c}`,steps:[`${b} × ${c} = ${b*c}`,`${a} + ${b*c} = ${a+b*c}`]}}
    if(t===1){const a=R(3,9),b=R(3,9),c=R(1,a*b-1);const tr=[];if(b>c)tr.push({v:a*(b-c),msg:'Prima la moltiplicazione, poi la sottrazione!'});return{text:'Calcola l’espressione.',math:`${a} × ${b} − ${c}`,ans:a*b-c,traps:tr,h1:H1,h2:`Parti da ${a} × ${b}`,steps:[`${a} × ${b} = ${a*b}`,`${a*b} − ${c} = ${a*b-c}`]}}
    const q=R(2,9),k=R(2,9),p=q*k,a=R(2,20);const tr=(a+p)%q===0?[{v:(a+p)/q,msg:'La divisione va fatta prima dell’addizione!'}]:[];return{text:'Calcola l’espressione.',math:`${a} + ${p} : ${q}`,ans:a+k,traps:tr,h1:H1,h2:`Parti da ${p} : ${q}`,steps:[`${p} : ${q} = ${k}`,`${a} + ${k} = ${a+k}`]}}
  if(L===2){const a=R(6,20),b=R(1,a-1),c=R(2,6),e=R(2,6),d=e*R(2,9);const ans=(a-b)*c+d/e;const tr=[];if(((a-b)*c+d)%e===0)tr.push({v:((a-b)*c+d)/e,msg:`La divisione riguarda solo ${d} : ${e}, non tutto quello che c’è prima.`});tr.push({v:a-b*c+d/e,msg:'Prima si risolve la parentesi!'});
    return{text:'Calcola l’espressione.',math:`(${a} − ${b}) × ${c} + ${d} : ${e}`,ans,traps:tr,h1:H1,h2:`Parentesi: ${a} − ${b} = ${a-b}`,steps:[`= ${a-b} × ${c} + ${d} : ${e}`,`= ${(a-b)*c} + ${d/e}`,`= ${ans}`]}}
  let a,b,c,d,e,q,s;
  for(;;){e=R(2,5);d=R(2,4);c=R(2,5);q=R(2,12);if((q*e+d*d)%c===0){s=(q*e+d*d)/c;if(s>=3)break}}
  a=R(1,s-1);b=s-a;
  return{text:'Calcola l’espressione (carta e penna ok).',math:`[(${a} + ${b}) × ${c} − ${P(d,2)}] : ${e}`,ans:q,traps:d===2?[]:[{v:(s*c-2*d)/e,msg:`${P(d,2)} vuol dire ${d} × ${d}, non ${d} × 2.`}],h1:H1+' Si parte dalle tonde, poi le quadre.',h2:`Tonde: ${a} + ${b} = ${s}. Potenza: ${P(d,2)} = ${d*d}`,steps:[`= [${s} × ${c} − ${d*d}] : ${e}`,`= [${s*c} − ${d*d}] : ${e}`,`= ${s*c-d*d} : ${e}`,`= ${q}`]}};

/* 7. MCD e mcm */
G.mcd=L=>{
  if(L===1){const D=pick([2,3,5,9,10]);const rules={2:'Un numero è divisibile per 2 se l’ultima cifra è pari (0, 2, 4, 6, 8).',3:'Un numero è divisibile per 3 se la somma delle sue cifre è divisibile per 3.',5:'Un numero è divisibile per 5 se finisce con 0 o 5.',9:'Un numero è divisibile per 9 se la somma delle sue cifre è divisibile per 9.',10:'Un numero è divisibile per 10 se finisce con 0.'};
    const ok=D*R(Math.ceil(101/D),Math.floor(999/D));const opts=[ok];while(opts.length<4){const x=R(101,999);if(x%D!==0&&!opts.includes(x))opts.push(x)}const sh=shuffle(opts);
    const ds=n=>String(n).split('').reduce((s,c)=>s+ +c,0);
    return{text:`Quale di questi numeri è divisibile per ${D}?`,choices:sh.map(String),correct:sh.indexOf(ok),ans:ok,h1:rules[D],h2:(D===3||D===9)?'Somma le cifre di ogni numero.':'Guarda l’ultima cifra di ogni numero.',steps:[(D===3||D===9)?`${ok}: ${String(ok).split('').join(' + ')} = ${ds(ok)}, che è divisibile per ${D}`:`${ok} finisce con ${ok%10}`,`Quindi ${ok} : ${D} = ${ok/D}`]}}
  if(L===2){let g,x,y;do{g=R(2,12);x=R(2,9);y=R(2,9)}while(x===y||gcd(x,y)!==1||g*x>120||g*y>120);const a=g*x,b=g*y;
    return{text:'Calcola il MCD (massimo comune divisore).',math:`MCD(${a}, ${b})`,ans:g,traps:[{v:lcm(a,b),msg:'Quello è il mcm! Il MCD è il divisore comune più GRANDE, quindi non può superare i due numeri.'}],h1:'Il MCD è il numero più grande che divide entrambi. Scomponi in fattori primi e prendi solo i fattori comuni, con l’esponente più piccolo.',h2:`${a} = ${fstr(a)} &nbsp;e&nbsp; ${b} = ${fstr(b)}`,steps:[`${a} = ${fstr(a)}`,`${b} = ${fstr(b)}`,`Fattori comuni: ${fstr(g)} = ${g}`]}}
  const P2=[4,6,8,9,10,12,15,18,20];let a,b;do{a=pick(P2);b=pick(P2)}while(a===b||a%b===0||b%a===0);const m=lcm(a,b);const [n1,n2]=shuffle(NAMES).slice(0,2);
  const text=pick([`${n1} va in piscina ogni ${a} giorni, ${n2} ogni ${b} giorni. Oggi ci sono andate insieme: tra quanti giorni si ritroveranno?`,`Un bus passa ogni ${a} minuti, un altro ogni ${b} minuti. Sono partiti insieme alle 8:00: dopo quanti minuti ripartono di nuovo insieme?`]);
  const tr=[];if(a*b!==m)tr.push({v:a*b,msg:'Il prodotto è un multiplo comune, ma non il più piccolo: cerca il mcm.'});tr.push({v:gcd(a,b),msg:'Quello è il MCD: qui serve il minimo comune MULTIPLO.'});
  return{text,ans:m,traps:tr,h1:'"Quando si ritrovano insieme" = minimo comune multiplo. Scomponi e prendi i fattori comuni e non comuni con l’esponente più grande.',h2:`Multipli di ${a}: ${[1,2,3,4,5].map(i=>a*i).join(', ')}…`,steps:[`${a} = ${fstr(a)}`,`${b} = ${fstr(b)}`,`mcm = ${fstr(m)} = ${m}`]}};

/* 8. Percentuali */
G.perc=L=>{
  if(L===1){const p=pick([10,50,25,20]);const mult={10:10,50:2,25:4,20:5}[p];const N=mult*R(3,40);const tip={10:'Il 10% è un decimo: dividi per 10.',50:'Il 50% è la metà.',25:'Il 25% è un quarto: dividi per 4.',20:'Il 20% è un quinto: dividi per 5.'}[p];
    return{text:`Quanto è il ${p}% di ${N}?`,ans:N*p/100,h1:'Percentuale = parti su 100. Il p% di N si calcola N × p : 100.',h2:tip,steps:[`${N} × ${p} : 100 = ${num(N*p/100)}`]}}
  if(L===2){const p=pick([15,30,40,60,75,5,35,12]);const N=20*R(2,20);const ans=rnd(N*p/100);
    return{text:`Calcola il ${p}% di ${N}.`,ans,traps:[{v:rnd(N/p),msg:`Non si divide per ${p}: si moltiplica per ${p} e si divide per 100.`}],h1:'Il p% di N = N × p : 100. Trucco: trova l’1% (dividi per 100) e poi moltiplica.',h2:`1% di ${N} = ${num(N/100)}. Ora moltiplica per ${p}.`,steps:[`${N} : 100 = ${num(N/100)}`,`${num(N/100)} × ${p} = ${num(ans)}`]}}
  if(Math.random()<.6){const [item,lo,hi]=pick([['le sneakers',4,7],['una felpa',2,4],['le cuffie wireless',3,6],['il biglietto del concerto',2,5],['un giubbotto',4,8]]);const price=20*R(lo,hi),p=pick([10,20,25,30,40,15]);const s=rnd(price*p/100),ans=rnd(price-s);
    return{text:`${item[0].toUpperCase()+item.slice(1)} costa${item.startsWith('le ')?'no':''} ${price} € e c’è lo sconto del ${p}%. Quanto paghi?`,ans,ph:'euro',traps:[{v:s,msg:'Quello è lo sconto! Ora toglilo dal prezzo.'}],h1:'Calcola lo sconto (prezzo × p : 100), poi sottrailo dal prezzo.',h2:`Sconto: ${price} × ${p} : 100 = ${num(s)} €`,steps:[`Sconto = ${num(s)} €`,`${price} − ${num(s)} = ${num(ans)} €`]}}
  let b,a,pc;do{b=pick([20,25,40,50,200]);pc=pick([10,20,25,40,60,75,80]);a=b*pc/100}while(!Number.isInteger(a));
  return{text:`${pick(NAMES)} ha risposto bene a ${a} domande su ${b}. Che percentuale ha fatto giusta?`,ans:pc,ph:'%',traps:[{v:rnd(a/b),msg:'Ci sei quasi: hai trovato la frazione decimale. Moltiplica per 100!'}],h1:'Percentuale = parte : totale × 100.',h2:`${a} : ${b} = ${num(a/b)}`,steps:[`${a} : ${b} = ${num(a/b)}`,`${num(a/b)} × 100 = ${pc}%`]}};

/* 9. Proporzioni */
G.prop=L=>{
  const H1='In una proporzione il prodotto dei medi è uguale al prodotto degli estremi. Per trovare un estremo: prodotto dei medi : l’altro estremo.';
  if(L===1){const a=R(2,6),k=R(2,5),b=a*k,c=R(2,9);return{text:`Trova ${X} nella proporzione.`,math:`${a} : ${b} = ${c} : ${X}`,eq:false,ans:c*k,h1:H1,h2:`${X} = ${b} × ${c} : ${a}`,steps:[`${b} × ${c} = ${b*c}`,`${b*c} : ${a} = ${c*k}`]}}
  if(L===2){let b,c,d;for(;;){b=R(2,15);c=R(2,15);d=R(2,12);if((b*c)%d===0&&d!==b&&d!==c&&b*c/d!==b)break}
    return{text:`Trova ${X} nella proporzione.`,math:`${X} : ${b} = ${c} : ${d}`,eq:false,ans:b*c/d,h1:'Qui x è un estremo: x = prodotto dei medi : l’altro estremo.',h2:`I medi sono ${b} e ${c}, l’altro estremo è ${d}.`,steps:[`${X} = ${b} × ${c} : ${d}`,`= ${b*c} : ${d} = ${b*c/d}`]}}
  const [it,its]=pick([['bubble tea','bubble tea'],['quaderno','quaderni'],['braccialetto','braccialetti'],['gelato','gelati']]);const n1=R(2,5),u=10*R(12,45),n2=R(n1+1,9);
  return{text:`${n1} ${its} costano ${num(n1*u/100)} €. Quanto costano ${n2} ${its}?`,ans:rnd(n2*u/100),ph:'euro',h1:'Prezzo e quantità sono direttamente proporzionali. Trova prima quanto costa 1, poi moltiplica.',h2:`1 ${it} costa ${num(n1*u/100)} : ${n1} = ?`,steps:[`${num(n1*u/100)} : ${n1} = ${num(u/100)} €`,`${num(u/100)} × ${n2} = ${num(n2*u/100)} €`]}};

/* 10. Radici */
G.radici=L=>{
  const H1='√n è il numero che moltiplicato per sé stesso dà n.';
  if(L===1){const k=R(2,12);const tr=k*k/2!==k?[{v:k*k/2,msg:'La radice non è la metà! Cerca il numero che moltiplicato per sé stesso dà '+k*k+'.'}]:[];return{text:'Calcola.',math:SQ(k*k),ans:k,traps:tr,h1:H1,h2:`? × ? = ${k*k}`,steps:[`${k} × ${k} = ${k*k}`,`quindi ${SQ(k*k)} = ${k}`]}}
  if(L===2){const k=R(13,25),lo=k-k%10,hi=lo+10;return{text:'Calcola (puoi stimare).',math:SQ(k*k),ans:k,h1:H1+' Stima tra due decine e guarda l’ultima cifra.',h2:`Stima: ${lo}² = ${lo*lo} e ${hi}² = ${hi*hi}. L’ultima cifra di ${k*k} è ${k*k%10}.`,steps:[`${k} × ${k} = ${k*k}`,`quindi ${SQ(k*k)} = ${k}`]}}
  if(Math.random()<.5){let n,d;do{n=R(1,9);d=R(2,12)}while(gcd(n,d)!==1);return{text:'Calcola e scrivi come frazione.',math:SQ(F(n*n,d*d)),ans:fr(n,d),ph:'es. 3/4',h1:'La radice di una frazione = radice del numeratore fratto radice del denominatore.',h2:`${SQ(n*n)} = ? e ${SQ(d*d)} = ?`,steps:[`${SQ(n*n)} = ${n}`,`${SQ(d*d)} = ${d}`,`→ ${F(n,d)}`]}}
  const [a,b,c]=pick([[6,8,10],[9,12,15],[5,12,13],[12,16,20],[8,15,17],[3,4,5]]);
  return{text:'Calcola.',math:SQ(`${a*a} + ${b*b}`),ans:c,traps:[{v:a+b,msg:'Attenzione: la radice di una somma NON è la somma delle radici. Prima fai la somma!'}],h1:'Prima calcoli quello che c’è sotto la radice, poi fai la radice.',h2:`${a*a} + ${b*b} = ${a*a+b*b}`,steps:[`${a*a} + ${b*b} = ${c*c}`,`${SQ(c*c)} = ${c}`]}};

/* 11. Misure */
const LAD={lun:{u:['km','hm','dam','m','dm','cm','mm'],f:10},mas:{u:['kg','hg','dag','g','dg','cg','mg'],f:10},cap:{u:['hL','daL','L','dL','cL','mL'],f:10},are:{u:['km²','hm²','dam²','m²','dm²','cm²','mm²'],f:100}};
function conv(lad,i,j,v){const s=Math.abs(j-i),f=lad.f**s;const down=j>i;const ans=rnd(down?v*f:v/f);
  return{text:'Completa l’equivalenza.',math:`${num(v)} ${lad.u[i]} = ? ${lad.u[j]}`,eq:false,ans,ph:lad.u[j],
   traps:lad.f===100?[{v:rnd(down?v*10**s:v/10**s),msg:'Con le unità quadrate (m², cm²…) ogni passo vale ×100, non ×10!'}]:[{v:rnd(down?v/f:v*f),msg:down?'Verso un’unità più piccola il numero diventa più grande: moltiplica.':'Verso un’unità più grande il numero diventa più piccolo: dividi.'}],
   h1:lad.f===100?'Unità di superficie: ogni passo nella scala vale ×100 (o :100).':'Ogni passo nella scala vale ×10. Verso unità più piccole moltiplichi, verso più grandi dividi.',
   h2:`Da ${lad.u[i]} a ${lad.u[j]}: ${s} ${s===1?'passo':'passi'} verso ${down?'destra → moltiplica':'sinistra → dividi'} per ${f}.`,
   scale:lad.u.slice(Math.min(i,j),Math.max(i,j)+1).join(' → '),
   steps:[`Scala: ${lad.u.slice(Math.min(i,j),Math.max(i,j)+1).join(' · ')}`,`${num(v)} ${down?'×':':'} ${f} = ${num(ans)} ${lad.u[j]}`]}}
G.misure=L=>{
  if(L===1){const lad=LAD.lun,i=R(0,4),j=i+R(1,Math.min(3,6-i));return conv(lad,i,j,R(2,30))}
  if(L===2){const lad=LAD[pick(['lun','mas','cap'])],n=lad.u.length;const s=R(1,3);
    if(Math.random()<.5){const i=R(0,n-1-s);return conv(lad,i,i+s,R(11,99)/10)}const j=R(0,n-1-s);return conv(lad,j+s,j,R(15,9999))}
  const lad=LAD.are,s=R(1,2);if(Math.random()<.5){const i=R(1,5-s);return conv(lad,i,i+s,R(11,99)/10)}const j=R(1,5-s);return conv(lad,j+s,j,50*R(3,180))};

/* 12. Perimetri e aree */
G.aree=L=>{
  if(L===1){const t=R(0,2);
    if(t===0){let b=R(4,15),h=R(2,12);if(b===h)b++;return{text:`Un rettangolo ha base ${b} cm e altezza ${h} cm. Quanto misura l’<b>area</b>?`,svg:fig('rect',{b:b+' cm',h:h+' cm'}),ans:b*h,ph:'cm²',traps:[{v:2*(b+h),msg:'Quello è il perimetro (il contorno). L’area è base × altezza.'}],h1:'Area del rettangolo = base × altezza.',h2:`${b} × ${h} = ?`,steps:[`A = ${b} × ${h} = ${b*h} cm²`]}}
    if(t===1){let b=R(4,15),h=R(2,12);if(b===h)b++;return{text:`Un rettangolo ha base ${b} cm e altezza ${h} cm. Quanto misura il <b>perimetro</b>?`,svg:fig('rect',{b:b+' cm',h:h+' cm'}),ans:2*(b+h),ph:'cm',traps:[{v:b*h,msg:'Quella è l’area. Il perimetro è la somma di tutti i lati.'},{v:b+h,msg:'Hai sommato solo due lati: i lati sono quattro!'}],h1:'Perimetro = somma di tutti i lati. Nel rettangolo: (base + altezza) × 2.',h2:`(${b} + ${h}) × 2 = ?`,steps:[`2p = (${b} + ${h}) × 2 = ${2*(b+h)} cm`]}}
    const l=R(3,15);return{text:`Un quadrato ha il lato di ${l} cm. Quanto misura il <b>perimetro</b>?`,svg:fig('square',{l:l+' cm'}),ans:4*l,ph:'cm',traps:l*l!==4*l?[{v:l*l,msg:'Quella è l’area. Il perimetro è lato × 4.'}]:[],h1:'Il quadrato ha 4 lati uguali: perimetro = lato × 4.',h2:`${l} × 4 = ?`,steps:[`2p = ${l} × 4 = ${4*l} cm`]}}
  if(L===2){const t=R(0,2);
    if(t===0){let b,h;do{b=R(4,20);h=R(3,15)}while((b*h)%2);return{text:`Un triangolo ha base ${b} cm e altezza ${h} cm. Calcola l’area.`,svg:fig('tri',{b:b+' cm',h:h+' cm'}),ans:b*h/2,ph:'cm²',traps:[{v:b*h,msg:'Ricordati di dividere per 2!'}],h1:'Area del triangolo = base × altezza : 2.',h2:`${b} × ${h} = ${b*h}. E poi?`,steps:[`A = ${b} × ${h} : 2`,`= ${b*h} : 2 = ${b*h/2} cm²`]}}
    if(t===1){const b=R(5,20),h=R(3,12);return{text:`Un parallelogramma ha base ${b} cm e altezza ${h} cm. Calcola l’area.`,svg:fig('para',{b:b+' cm',h:h+' cm'}),ans:b*h,ph:'cm²',traps:[{v:b*h/2,msg:'Il parallelogramma è come un rettangolo “inclinato”: base × altezza, senza dividere per 2.'}],h1:'Area del parallelogramma = base × altezza (come il rettangolo).',h2:`${b} × ${h} = ?`,steps:[`A = ${b} × ${h} = ${b*h} cm²`]}}
    let D,d;do{D=R(8,24);d=R(4,D-2)}while((D*d)%2);return{text:`Un rombo ha le diagonali di ${D} cm e ${d} cm. Calcola l’area.`,svg:fig('rombo',{D:D,d:d}),ans:D*d/2,ph:'cm²',traps:[{v:D*d,msg:'Ricordati di dividere per 2!'}],h1:'Area del rombo = diagonale maggiore × diagonale minore : 2.',h2:`${D} × ${d} = ${D*d}. E poi?`,steps:[`A = ${D} × ${d} : 2 = ${D*d/2} cm²`]}}
  if(Math.random()<.55){let B,b,h;do{B=R(10,24);b=R(4,B-2);h=R(3,12)}while(((B+b)*h)%2);return{text:`Un trapezio ha base maggiore ${B} cm, base minore ${b} cm e altezza ${h} cm. Calcola l’area.`,svg:fig('trap',{B:B,b:b,h:h}),ans:(B+b)*h/2,ph:'cm²',traps:[{v:(B+b)*h,msg:'Ricordati di dividere per 2!'},{v:B*b*h/2,msg:'Le due basi si SOMMANO, non si moltiplicano.'}],h1:'Area del trapezio = (base maggiore + base minore) × altezza : 2.',h2:`${B} + ${b} = ${B+b}`,steps:[`A = (${B} + ${b}) × ${h} : 2`,`= ${B+b} × ${h} : 2 = ${(B+b)*h/2} cm²`]}}
  const b=R(5,18),h=R(3,14),p=2*(b+h);return{text:`Un rettangolo ha perimetro ${p} cm e base ${b} cm. Quanto misura l’area?`,svg:fig('rect',{b:b+' cm',h:'?'}),ans:b*h,ph:'cm²',traps:[{v:b*(p-b),msg:'Il perimetro contiene 2 basi e 2 altezze: prima dividi per 2.'}],h1:'Prima trova l’altezza: semiperimetro − base. Poi area = base × altezza.',h2:`Semiperimetro: ${p} : 2 = ${p/2}. Altezza = ${p/2} − ${b}`,steps:[`h = ${p/2} − ${b} = ${h} cm`,`A = ${b} × ${h} = ${b*h} cm²`]}};

/* 13. Angoli */
G.angoli=L=>{
  if(L===1){if(Math.random()<.5){const a=R(10,80);return{text:`Quanto misura il complementare di un angolo di ${a}°?`,ans:90-a,ph:'°',traps:[{v:180-a,msg:'Quello è il supplementare (180°). Complementari = somma 90°.'}],h1:'Due angoli sono complementari se insieme fanno 90°, supplementari se fanno 180°.',h2:`90 − ${a} = ?`,steps:[`90° − ${a}° = ${90-a}°`]}}
    const a=R(20,160);return{text:`Quanto misura il supplementare di un angolo di ${a}°?`,ans:180-a,ph:'°',traps:a<90?[{v:90-a,msg:'Quello è il complementare (90°). Supplementari = somma 180°.'}]:[],h1:'Due angoli sono complementari se insieme fanno 90°, supplementari se fanno 180°.',h2:`180 − ${a} = ?`,steps:[`180° − ${a}° = ${180-a}°`]}}
  if(L===2){const a=R(20,100),b=R(20,150-a);return{text:`In un triangolo due angoli misurano ${a}° e ${b}°. Quanto misura il terzo?`,ans:180-a-b,ph:'°',traps:[{v:360-a-b,msg:'La somma degli angoli interni di un TRIANGOLO è 180° (360° è per i quadrilateri).'}],h1:'La somma degli angoli interni di un triangolo è sempre 180°.',h2:`${a} + ${b} = ${a+b}`,steps:[`${a}° + ${b}° = ${a+b}°`,`180° − ${a+b}° = ${180-a-b}°`]}}
  if(Math.random()<.5){const v=2*R(10,70);return{text:`In un triangolo isoscele l’angolo al vertice misura ${v}°. Quanto misura ciascuno dei due angoli alla base?`,ans:(180-v)/2,ph:'°',traps:[{v:180-v,msg:'Quella è la somma dei DUE angoli alla base: dividi per 2.'}],h1:'Nel triangolo isoscele gli angoli alla base sono uguali, e tutti e tre fanno 180°.',h2:`180 − ${v} = ${180-v}, da dividere fra due angoli uguali.`,steps:[`180° − ${v}° = ${180-v}°`,`${180-v}° : 2 = ${(180-v)/2}°`]}}
  let a,b,c,d;do{a=R(60,130);b=R(60,130);c=R(60,130);d=360-a-b-c}while(d<40||d>170);
  return{text:`Un quadrilatero ha tre angoli di ${a}°, ${b}° e ${c}°. Quanto misura il quarto?`,ans:d,ph:'°',traps:[{v:180-a-b-c,msg:'Nei quadrilateri la somma degli angoli è 360°.'}],h1:'La somma degli angoli interni di un quadrilatero è 360°.',h2:`${a} + ${b} + ${c} = ${a+b+c}`,steps:[`${a}° + ${b}° + ${c}° = ${a+b+c}°`,`360° − ${a+b+c}° = ${d}°`]}};

/* 14. Pitagora */
function triple(){const [t,k]=pick([[[3,4,5],R(1,6)],[[5,12,13],R(1,2)],[[8,15,17],R(1,2)],[[7,24,25],1],[[20,21,29],1]]);return t.map(x=>x*k)}
G.pitagora=L=>{
  const H1='Teorema di Pitagora: nel triangolo rettangolo ipotenusa² = cateto² + cateto².';
  const [a,b,c]=triple();
  if(L===1)return{text:`Un triangolo rettangolo ha i cateti di ${a} cm e ${b} cm. Quanto misura l’ipotenusa?`,svg:fig('rt',{a:a,b:b,c:'?'}),ans:c,ph:'cm',traps:[{v:a+b,msg:'Non si sommano i cateti: si sommano i loro QUADRATI e poi si fa la radice.'}],h1:H1+' Quindi i = √(a² + b²).',h2:`${a}² + ${b}² = ${a*a} + ${b*b} = ${a*a+b*b}`,steps:[`${a}² + ${b}² = ${a*a} + ${b*b} = ${c*c}`,`i = ${SQ(c*c)} = ${c} cm`]};
  if(L===2)return{text:`In un triangolo rettangolo l’ipotenusa misura ${c} cm e un cateto ${a} cm. Quanto misura l’altro cateto?`,svg:fig('rt',{a:a,b:'?',c:c}),ans:b,ph:'cm',traps:[{v:c-a,msg:'Non basta sottrarre i lati: fai c² − a² e poi la radice.'}],h1:'Per trovare un cateto: cateto = √(ipotenusa² − altro cateto²).',h2:`${c}² − ${a}² = ${c*c} − ${a*a} = ${c*c-a*a}`,steps:[`${c}² − ${a}² = ${c*c} − ${a*a} = ${b*b}`,`${SQ(b*b)} = ${b} cm`]};

const H_REL='Segni uguali: sommi i valori assoluti e tieni il segno. Segni diversi: sottrai i valori assoluti e tieni il segno di quello “più forte”.';
G.relativi=L=>{
  if(L===1){let a,b;do{a=R(1,15)*(Math.random()<.5?-1:1);b=R(1,15)*(Math.random()<.5?-1:1)}while(a>0&&b>0||Math.abs(a)===Math.abs(b));const ans=a+b;const tr=[];

    return{text:'Calcola.',math:`${sg(a)} + ${sg(b)}`,ans,traps:tr,h1:H_REL,h2:a*b<0?`Segni diversi: ${Math.max(Math.abs(a),Math.abs(b))} − ${Math.min(Math.abs(a),Math.abs(b))}, con il segno di ${Math.abs(a)>Math.abs(b)?sg(a):sg(b)}`:`Segni uguali: ${Math.abs(a)} + ${Math.abs(b)}, segno −`,steps:[`${sg(a)} + ${sg(b)} = ${num(ans)}`]}}
  if(L===2){const t=R(0,2);const s=()=>Math.random()<.5?-1:1;
    if(t===0){const a=R(2,9)*s(),b=R(2,9)*s();return{text:'Calcola.',math:`${sg(a)} × ${sg(b)}`,ans:a*b,traps:[{v:-a*b,msg:'Regola dei segni: segni uguali → +, segni diversi → −.'}],h1:'Regola dei segni: + per + = +, − per − = +, segni diversi = −.',h2:`${Math.abs(a)} × ${Math.abs(b)} = ${Math.abs(a*b)}. Il segno?`,steps:[`segno: ${a*b>0?'uguali → +':'diversi → −'}`,`= ${num(a*b)}`]}}
    if(t===1){const q=R(2,9)*s(),b=R(2,9)*s(),a=q*b;return{text:'Calcola.',math:`${sg(a)} : ${sg(b)}`,ans:q,traps:[{v:-q,msg:'Regola dei segni: vale anche per la divisione.'}],h1:'Regola dei segni (vale anche per :): segni uguali → +, segni diversi → −.',h2:`${Math.abs(a)} : ${Math.abs(b)} = ${Math.abs(q)}. Il segno?`,steps:[`segno: ${q>0?'uguali → +':'diversi → −'}`,`= ${num(q)}`]}}
    const a=R(1,12)*s(),b=-R(2,12);return{text:'Calcola.',math:`${sg(a)} − ${sg(b)}`,ans:a-b,traps:[{v:a+b,msg:'Togliere un numero negativo vuol dire AGGIUNGERE il suo opposto: − (−8) = +8.'}],h1:'Sottrarre un numero relativo = sommare il suo opposto.',h2:`${sg(a)} − ${sg(b)} = ${sg(a)} + ${sg(-b)}`,steps:[`= ${sg(a)} + ${sg(-b)}`,`= ${num(a-b)}`]}}
  const a=R(2,3),e=R(2,3),s=()=>Math.random()<.5?-1:1,b=R(2,6)*s(),c=R(2,6)*s(),d=R(2,12)*s();const p=(-a)**e,ans=p+b*c-d;
  const tr=[{v:-p+b*c-d,msg:e%2?'Base negativa con esponente dispari: il risultato è negativo.':'Base negativa con esponente pari: il risultato è positivo.'},{v:p+b*c+d,msg:`Attenzione al “− ${sg(d)}”: togliere ${sg(d)} vuol dire aggiungere ${sg(-d)}.`}];
  return{text:'Calcola l’espressione (carta e penna ok).',math:`(−${a})<sup>${e}</sup> + ${sg(b)} × ${sg(c)} − ${sg(d)}`,ans,traps:tr,h1:'Ordine: prima la potenza, poi la moltiplicazione, infine somme e differenze. Occhio ai segni!',h2:`(−${a})<sup>${e}</sup> = ${num(p)} e ${sg(b)} × ${sg(c)} = ${num(b*c)}`,steps:[`= ${num(p)} + ${sg(b*c)} − ${sg(d)}`,`= ${num(p)} ${b*c<0?'−':'+'} ${Math.abs(b*c)} ${-d<0?'−':'+'} ${Math.abs(d)}`,`= ${num(ans)}`]}};

G.equazioni=L=>{
  const H1='Un’equazione è una bilancia: quello che fai a sinistra lo fai anche a destra. Porta i numeri da una parte e la x dall’altra.';
  if(L===1){const x=R(2,20),t=R(0,2);

  if(L===2){const a=R(2,9),x=R(1,12),b=R(1,20),neg=Math.random()<.4&&a*x>b;const c=neg?a*x-b:a*x+b;const tr=[];const alt=neg?c-b:c+b;if(alt%a===0)tr.push({v:alt/a,msg:`Quando sposti il ${neg?'− ':'+ '}${b} dall’altra parte, cambia segno.`});
    return{text:`Risolvi: quanto vale ${X}?`,math:`${a}${X} ${neg?'−':'+'} ${b} = ${c}`,eq:false,ans:x,ph:'x =',traps:tr,h1:H1,h2:`Prima porta il ${b} a destra: ${a}${X} = ${c} ${neg?'+':'−'} ${b}`,steps:[`${a}${X} = ${c} ${neg?'+':'−'} ${b} = ${a*x}`,`${X} = ${a*x} : ${a} = ${x}`]}}
  const x=R(1,10);
  if(Math.random()<.5){const a=R(3,9),c=R(1,a-1),b=R(1,15),d=a*x+b-c*x;return{text:`Risolvi: quanto vale ${X}?`,math:`${a}${X} + ${b} = ${c===1?'':c}${X} + ${d}`,eq:false,ans:x,ph:'x =',h1:H1+' Le x a sinistra, i numeri a destra (cambiando segno quando attraversano l’uguale).',h2:`${a}${X} − ${c===1?'':c}${X} = ${d} − ${b}`,steps:[`${a-c}${X} = ${d-b}`,`${X} = ${d-b} : ${a-c} = ${x}`]}}
