function gMsg(html,kind){const m=document.getElementById('gmsg');if(!m)return;m.className='gmsg show '+(kind||'');m.innerHTML=html;clearTimeout(GM.msgT);GM.msgT=setTimeout(()=>{m.className='gmsg'},kind==='bad'?3800:1600)}

/* ---------- input ---------- */
function gTap(e){if(!GM)return;const r=GM.c.getBoundingClientRect(),x=e.clientX-r.left+GM.camX,y=e.clientY-r.top;
  if(GM.phase==='wait'){const p=GM.plats.find(p=>p.state==='ok'&&x>=p.x-10&&x<=p.x+p.w+10&&y>=p.y-50&&y<=p.y+p.h+20);if(p){gChoose(p.i);return}}
  if(GM.phase==='run'&&GM.p.on){GM.p.vy=-G_.jv;GM.p.on=false;GM.tapped=true;sfx('jump')}}
function gKey(e){if(!GM)return;if(GM.phase==='wait'&&['1','2','3'].includes(e.key)){gChoose(+e.key-1);return}if((e.key===' '||e.key==='ArrowUp')&&GM.phase==='run'&&GM.p.on){e.preventDefault();GM.p.vy=-G_.jv;GM.p.on=false;sfx('jump')}}
function gChoose(i){if(!GM||GM.phase!=='wait')return;const p=GM.plats[i];if(!p||p.state!=='ok')return;
  setChoices(false);GM.target=p;gJumpTo(p.x+p.w/2,p.y,()=>gLand(p))}
function setChoices(on){document.querySelectorAll('#gch .gchoice').forEach(b=>{const p=GM.plats[+b.dataset.gc];b.disabled=!on||!p||p.state!=='ok'})}
function gJumpTo(tx,ty,cb){const p=GM.p,T=0.62;p.vx=(tx-p.x)/T;p.vy=(ty-p.y-0.5*G_.g*T*T)/T;p.on=false;GM.phase='jump';GM.jt={tx,ty,cb,t:0,T};sfx('jump')}
function gLand(pl){const c=PS.cur,q=c.q;GM.p.sq=1;
  if(pl.ok){const kind=c.shown?'guided':(c.tries===0&&c.hints===0?'auto':'help');c.done=true;const r=scoreQ(kind,q);
    burst(pl.x+pl.w/2,pl.y,24,['#FFD84D','#FF6FA8','#7FE3C0','#fff']);sfx('ok');sfx('coin');
    document.getElementById('gcoins').textContent=ST.coins;
    gMsg(kind==='auto'?`${pick(GOOD)} <b>+${r.coins} 🪙</b>${PS.combo>=3?` · combo ×${PS.combo} 🔥`:''}`:kind==='help'?`${pick(GOOD_HELP)} <b>+${r.coins} 🪙</b>`:'Ora sai come si fa 💜','good');
    if(GM.boss&&kind!=='guided'){const dmg=kind==='auto'?(q.level>=2?22:18):9;GM.proj.push({x:GM.p.x,y:GM.p.y-30,t:0,dmg})}
    gDots();GM.phase='celebrate';
    setTimeout(()=>{if(!GM)return;const last=PS.idx+1>=PS.queue.length;const j=GM.j;
      gJumpTo(j.x0+j.w+36,GM.gy,()=>{GM.p.on=true;GM.p.y=GM.gy;
        if(GM.boss&&PS.hp<=0){gFinish();return}
        PS.idx++;if(PS.idx>=PS.queue.length){gFinishRun(j.x0+j.w+36);return}
        GM.qn++;GM.phase='run';buildSegment(j.x0+j.w+36);gDots()})},750);
    return}
  c.tries++;pl.state='crack';sfx('ko');PS.combo=0;
  const t=q.traps&&q.traps.find(t=>txt(t.v)===pl.label);
  gMsg(t?`<b>Occhio!</b> ${t.msg}`:pick(SOFT),'bad');
  setTimeout(()=>{if(!GM)return;pl.state='fall';GM.phase='fall';GM.p.on=false;GM.p.vx=0;GM.p.vy=-200},420);
  if(c.hints<c.tries&&c.hints<2){c.hints=c.tries;showHints()}}
function gRespawn(){const j=GM.j;Object.assign(GM.p,{x:j.x0-26,y:GM.top+20,vx:0,vy:0,on:false});GM.phase='drop';
  const left=GM.plats.filter(p=>p.state==='ok');if(left.length===1&&!PS.cur.shown){PS.cur.hints=Math.max(PS.cur.hints,2)}}
function gFinishRun(x){GM.flagX=x+Math.max(260,GM.W*0.6);GM.ground.push([x,GM.flagX+GM.W]);GM.j=null;GM.plats=[];GM.phase='run';
  document.getElementById('gq').innerHTML=`<p class="gdone">${PS.type==='boss'?'Il boss scappa… corri al traguardo!':'Ultimo sprint fino alla bandiera! 🏁'}</p>`;document.getElementById('gch').innerHTML=''}
function gFinish(){if(!GM)return;GM.phase='done';confetti(140);sfx('win');setTimeout(()=>{gStop();endPlay()},900)}

/* ---------- aiuti ---------- */
function showHints(){const c=PS.cur,q=c.q,box=document.getElementById('ghints');if(!box)return;
  let h=`<div class="gh-head"><span>${ico(ST.pet,'mini')} ${petName()} ti aiuta</span><button class="gbtn" data-act="ghclose" aria-label="Chiudi">✕</button></div>`;
  if(c.hints>=1)h+=`<div class="hint"><span class="lab">ricorda la regola</span>${q.h1}</div>`;
  if(c.hints>=2)h+=`<div class="hint"><span class="lab">primo passo</span>${q.h2}</div>`;
  if(c.hints>=3)h+=`<div class="steps"><span class="lab">ecco come si fa:</span><ol>${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol><p style="margin-top:6px">Risposta: <b>${fmt(q.ans)}</b></p></div>`;
  else h+=`<button class="btn soft wide" data-act="ghint">${c.hints===1?'💡 Un altro aiutino':'👀 Fammi vedere come si fa'}</button>`;
  box.innerHTML=h;box.hidden=false}
function gHint(){const c=PS.cur;if(!c||c.done)return;if(c.hints<3){c.hints++;if(c.hints===3)c.shown=true}showHints()}

/* ---------- ciclo ---------- */
function solidAt(x){return GM.ground.some(([a,b])=>x>=a&&x<=b)}
function gLoop(now){if(!GM)return;const dt=Math.min(0.033,(now-GM.last)/1000);GM.last=now;GM.t+=dt;gUpdate(dt);gDraw();GM.raf=requestAnimationFrame(gLoop)}
function gUpdate(dt){const p=GM.p;
  if(GM.phase==='run'){p.x+=G_.speed*dt;GM.camT=p.x-GM.W*0.24;
    if(GM.j&&p.x>=GM.j.x0-26){p.x=GM.j.x0-26;if(p.on){GM.phase='wait';setChoices(true);GM.camT=GM.j.x0-Math.max(70,(GM.W-GM.j.w)/2)}}
    if(GM.flagX&&p.x>=GM.flagX){gFinish()}}
  if(GM.phase==='wait'||GM.phase==='celebrate'||GM.phase==='landed'||GM.phase==='fall'||GM.phase==='drop'){if(GM.j)GM.camT=GM.j.x0-Math.max(70,(GM.W-GM.j.w)/2)}
  if(!p.on||GM.phase==='jump'){p.vy+=G_.g*dt;p.y+=p.vy*dt}
  if(GM.phase==='jump'){p.x+=p.vx*dt;GM.jt.t+=dt;if(GM.jt.t>=GM.jt.T){p.x=GM.jt.tx;p.y=GM.jt.ty;p.vy=0;p.on=true;GM.phase='landed';const cb=GM.jt.cb;GM.jt=null;cb()}}
  else if(GM.phase==='run'&&!p.on&&p.y>=GM.gy){p.y=GM.gy;p.vy=0;p.on=true;p.sq=1}
  if(GM.phase==='fall'){if(p.y>GM.H+60)gRespawn()}
  if(GM.phase==='drop'&&p.y>=GM.gy){p.y=GM.gy;p.vy=0;p.on=true;p.sq=1;GM.phase='wait';setChoices(true);burst(p.x,p.y,10,['#fff','#CFF1FF'])}
  GM.plats.forEach(pl=>{if(pl.state==='fall'){pl.fall+=dt;pl.y+=600*dt*pl.fall*3}if(pl.state==='crack')pl.shake+=dt});
  if(GM.phase==='landed'&&GM.target&&GM.target.state==='fall'){}
  GM.camX+=(GM.camT-GM.camX)*Math.min(1,dt*5);
  p.sq=Math.max(0,p.sq-dt*4);
  for(const c of GM.coins)if(!c.got&&Math.abs(c.x-p.x)<26&&Math.abs((GM.gy+c.y)-(p.y-26))<34){c.got=true;PS.coins+=1;ST.coins+=1;sfx('coin');burst(c.x,GM.gy+c.y,6,['#FFD84D','#fff']);const el=document.getElementById('gcoins');if(el)el.textContent=ST.coins}
  for(const o of GM.obst)if(!o.hit&&Math.abs(o.x-p.x)<24&&p.y>GM.gy-30){o.hit=true;p.vy=-420;p.on=false;sfx('ko');gMsg('Ops! Tocca per saltare gli ostacoli','bad')}
  for(const pr of GM.proj){pr.t+=dt;if(pr.t>=0.7&&!pr.hit){pr.hit=true;PS.hp=Math.max(0,PS.hp-pr.dmg);GM.bossShake=0.5;sfx('hit');const hp=document.getElementById('ghp');if(hp)hp.style.width=PS.hp+'%';burst(GM.camX+GM.W-80,GM.top+60,18,['#FF6FA8','#FFD84D','#fff'])}}
  GM.bossShake=Math.max(0,GM.bossShake-dt);
  GM.parts=GM.parts.filter(q=>(q.life-=dt)>0);for(const q of GM.parts){q.vy+=900*dt;q.x+=q.vx*dt;q.y+=q.vy*dt}}
function burst(x,y,n,cols){for(let i=0;i<n;i++)GM.parts.push({x,y,vx:(Math.random()-.5)*360,vy:-Math.random()*420-60,life:0.7+Math.random()*0.4,c:pick(cols),r:3+Math.random()*4})}

/* ---------- disegno ---------- */
function rr(x,y,w,h,r){const c=GM.ctx;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function gDraw(){const c=GM.ctx,W=GM.W,H=GM.H,th=GM.th,cam=GM.camX,gy=GM.gy;
  let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
  if(th===WTH.ter){c.fillStyle='#fff';for(const s of GM.stars){c.globalAlpha=0.4+0.4*Math.sin(GM.t*2+s[0]*20);c.fillRect(((s[0]*W*2-cam*0.05)%W+W)%W,s[1]*H,s[2],s[2])}c.globalAlpha=1}
  c.fillStyle=th.sun;c.beginPath();c.arc(W*0.82,GM.top+70,30,0,7);c.fill();
  // nuvole
  c.fillStyle='rgba(255,255,255,'+(th===WTH.ter?0.08:0.8)+')';for(let i=0;i<4;i++){const x=((i*260-cam*0.15-GM.t*8)%(W+300)+W+300)%(W+300)-150,y=H*0.12+i%2*50;c.beginPath();c.ellipse(x,y,46,18,0,0,7);c.ellipse(x+30,y-10,30,18,0,0,7);c.ellipse(x-28,y-4,24,14,0,0,7);c.fill()}
  // colline
  for(const [col,par,amp,base] of [[th.h1,0.25,40,gy-60],[th.h2,0.5,26,gy-24]]){c.fillStyle=col;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W+10;x+=10){const wx=x+cam*par;c.lineTo(x,base-amp*(0.5+0.5*Math.sin(wx/140))-amp*0.4*Math.sin(wx/57))}c.lineTo(W,H);c.fill()}
  c.save();c.translate(-cam,0);
  // burrone
  for(const j of GM.gaps){if(j.x0>cam+W||j.x0+j.w<cam)continue;g=c.createLinearGradient(0,gy,0,H);g.addColorStop(0,th.gap[0]);g.addColorStop(1,th.gap[1]);c.fillStyle=g;c.fillRect(j.x0,gy+18,j.w,H-gy);
    c.fillStyle='rgba(255,255,255,.35)';for(let x=j.x0;x<j.x0+j.w;x+=34){c.fillRect(x+((GM.t*30)%34),gy+30+Math.sin(x)*4,14,3)}
    c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.ellipse(j.x0+j.w/2,H-14,j.w*0.42,20,0,0,7);c.fill()}
  // terreno
  for(const [a,b] of GM.ground){if(b<cam-50||a>cam+W+50)continue;const x0=Math.max(a,cam-50),x1=Math.min(b,cam+W+50);
    c.fillStyle=th.dirt;c.fillRect(x0,gy,x1-x0,H-gy);c.fillStyle=th.dirt2;for(let x=Math.floor(x0/40)*40;x<x1;x+=40){c.fillRect(x+8,gy+40+(x%80?18:0),14,8)}
    c.fillStyle=th.grass;rr(x0,gy-6,x1-x0,24,10);c.fill();c.fillStyle=th.grass2;c.fillRect(x0,gy+14,x1-x0,6)}
  // decorazioni
  c.textAlign='center';c.textBaseline='alphabetic';for(const d of GM.deco){if(d.x<cam-80||d.x>cam+W+80||!solidAt(d.x))continue;c.font=`${Math.round(40*d.s)}px serif`;c.fillText(d.e,d.x,gy-4)}
  // bandiera
  if(GM.flagX){c.fillStyle='#3a2a1a';c.fillRect(GM.flagX,gy-130,6,130);c.fillStyle='#FF4FA0';c.beginPath();c.moveTo(GM.flagX+6,gy-128);c.lineTo(GM.flagX+60+Math.sin(GM.t*6)*4,gy-110);c.lineTo(GM.flagX+6,gy-92);c.fill();c.font='30px serif';c.fillText('🏁',GM.flagX+3,gy-134)}
  // ostacoli e monete
  c.font='34px serif';for(const o of GM.obst){if(o.x<cam-40||o.x>cam+W+40)continue;c.globalAlpha=o.hit?0.4:1;c.fillText(o.e,o.x,gy+2);c.globalAlpha=1}
  for(const k of GM.coins){if(k.got||k.x<cam-30||k.x>cam+W+30)continue;const y=gy+k.y-26,s=Math.abs(Math.cos(GM.t*4+k.x));c.fillStyle='#E8A400';c.beginPath();c.ellipse(k.x,y,11*s+2,12,0,0,7);c.fill();c.fillStyle='#FFD84D';c.beginPath();c.ellipse(k.x,y,8*s+1,9,0,0,7);c.fill()}
  // piattaforme
  c.textBaseline='middle';
  GM.plats.forEach((p,i)=>{if(p.y>H+80)return;const sx=p.state==='crack'?Math.sin(p.shake*60)*3:0;const x=p.x+sx,y=p.y;
    c.fillStyle='rgba(0,0,0,.18)';rr(x+3,y+8,p.w,p.h,14);c.fill();
    g=c.createLinearGradient(0,y,0,y+p.h);g.addColorStop(0,th.plat[0]);g.addColorStop(1,th.plat[1]);c.fillStyle=g;rr(x,y,p.w,p.h,14);c.fill();
    c.strokeStyle='#2B1E3F';c.lineWidth=3;rr(x,y,p.w,p.h,14);c.stroke();
    c.fillStyle='rgba(255,255,255,.45)';rr(x+8,y+5,p.w-16,7,4);c.fill();
    if(p.state!=='ok'){c.strokeStyle='#2B1E3F';c.lineWidth=2;c.beginPath();c.moveTo(x+p.w*0.3,y);c.lineTo(x+p.w*0.45,y+p.h*0.6);c.lineTo(x+p.w*0.6,y+p.h);c.stroke()}
    const fs=p.label.length>6?18:p.label.length>4?21:25;c.font=`800 ${fs}px "Bricolage Grotesque",system-ui,sans-serif`;c.fillStyle='#fff';c.lineWidth=4;c.strokeStyle='#2B1E3F';c.strokeText(p.label,x+p.w/2,y+p.h/2+1);c.fillText(p.label,x+p.w/2,y+p.h/2+1);
    if(GM.phase==='wait'&&p.state==='ok'){c.font='700 12px system-ui';c.fillStyle='rgba(43,30,63,.75)';c.fillText(['①','②','③'][i],x+p.w/2,y-12)}});
  // giocatore
  drawPlayer(c);
  // proiettili verso il boss
  for(const pr of GM.proj){if(pr.hit)continue;const k=pr.t/0.7,bx=cam+W-80,by=GM.top+60;const x=pr.x+(bx-pr.x)*k,y=pr.y+(by-pr.y)*k-Math.sin(k*Math.PI)*90;c.fillStyle='#FF6FA8';c.beginPath();c.arc(x,y,11,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(x,y,7,GM.t*10,GM.t*10+3);c.stroke()}
  for(const q of GM.parts){c.fillStyle=q.c;c.fillRect(q.x-q.r/2,q.y-q.r/2,q.r,q.r)}
  c.restore();
  if(GM.boss&&GM.bimg&&GM.bimg.complete){const s=GM.bossShake>0?Math.sin(GM.t*80)*6:0,bob=Math.sin(GM.t*3)*5;c.save();c.globalAlpha=PS.hp<=0?Math.max(0,1-(0.5-GM.bossShake)*2):1;c.drawImage(GM.bimg,W-150+s,GM.top+bob,130,130);c.restore()}
  if(GM.phase==='wait'){c.font='700 15px system-ui';c.textAlign='center';c.fillStyle='rgba(43,30,63,.85)';const tip=PS.cur&&PS.cur.tries?'Scegli un’altra piattaforma':'Tocca la piattaforma giusta!';const tw=c.measureText(tip).width+24;c.fillStyle='rgba(255,255,255,.85)';rr(W/2-tw/2,GM.top+14,tw,28,14);c.fill();c.fillStyle='#2B1E3F';c.fillText(tip,W/2,GM.top+29)}
  if(GM.phase==='run'&&PS.idx===0&&GM.qn===0&&!GM.tapped){c.font='700 15px system-ui';c.textAlign='center';const tip='Tocca lo schermo per saltare 👆';const tw=c.measureText(tip).width+24;c.fillStyle='rgba(43,30,63,.85)';rr(W/2-tw/2,GM.top+14,tw,28,14);c.fill();c.fillStyle='#fff';c.fillText(tip,W/2,GM.top+29)}}
function drawPlayer(c){const p=GM.p,t=GM.t,run=GM.phase==='run'&&p.on;const sq=p.sq,bob=run?Math.abs(Math.sin(t*14))*4:0;
  const x=p.x,y=p.y-bob,body=ST.pet==='lulu'?'#9A8466':ST.pet==='mirtillo'?'#7D8596':'#E0408F';
  c.save();c.translate(x,y);c.scale(1+sq*0.18,1-sq*0.18);
  c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(0,2,20,5,0,0,7);c.fill();
  // coda
  c.strokeStyle=body;c.lineWidth=6;c.lineCap='round';c.beginPath();c.moveTo(-14,-18);c.quadraticCurveTo(-30,-26+Math.sin(t*8)*6,-26,-44);c.stroke();
  // zampe
  c.fillStyle=body;const lg=run?Math.sin(t*14)*6:0;for(const [lx,o] of [[-8,lg],[8,-lg]]){rr(lx-4+o*0.5,-12,8,12,4);c.fill()}
  c.beginPath();c.ellipse(0,-22,17,14,0,0,7);c.fill();
  // testa
  const r=22,hy=-52;
  if(GM.img&&GM.img.complete){c.save();c.beginPath();c.arc(0,hy,r,0,7);c.closePath();c.fillStyle='#fff';c.fill();c.clip();c.drawImage(GM.img,-r,hy-r,r*2,r*2);c.restore();c.strokeStyle='#fff';c.lineWidth=3.5;c.beginPath();c.arc(0,hy,r,0,7);c.stroke()}
  else{c.font='40px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(ST.pet,0,hy)}
  c.restore()}

function blank(){return{v:1,name:'',avatar:'🦋',theme:'auto',sound:true,xp:0,coins:0,streak:0,lastDay:null,days:{},badges:{},skills:{},lv:{},boss:{},test:null,recent:[],sessions:[],total:0,braveCount:0,pet:'mirtillo',own:{av:AVATARS.filter(a=>!a[1]).map(a=>a[0]),pet:['mirtillo','lulu','🐱'],th:['auto','quaderno']},missionDay:null}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1){const b=blank();const o=Object.assign(b,s);o.own=Object.assign(blank().own,s.own||{});['mirtillo','lulu'].forEach(c=>{if(!o.own.pet.includes(c))o.own.pet.push(c);if(!o.own.av.includes(c))o.own.av.push(c)});if(!s.petSet&&o.pet==='🐱')o.pet='mirtillo';return o}}catch(e){}return blank()}
let ST=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
const sk=id=>ST.skills[id]||(ST.skills[id]={m:0,tested:false,done:0,auto:0,helped:0,guided:0,last:null});
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dkey(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dkey(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lvlFromXp=xp=>Math.floor((1+Math.sqrt(1+8*xp/60))/2);
const xpFor=l=>60*l*(l-1)/2;
const levelFor=m=>m<40?1:m<75?2:3;
const lvS=(id,L)=>(ST.lv[id]||{})[L]||0;
const testDone=()=>!!(ST.test&&ST.test.done);
const isOpen=(id,L)=>testDone()&&(L===1||lvS(id,L-1)>0);
const bossOpen=w=>testDone()&&SKILLS.filter(s=>s.world===w).every(s=>lvS(s.id,1)>0);
const totalStars=()=>SKILLS.reduce((a,s)=>a+lvS(s.id,1)+lvS(s.id,2)+lvS(s.id,3),0)+Object.values(ST.boss).reduce((a,b)=>a+(b||0),0);
function status(id){const s=sk(id),meta=SK[id];
  if(!s.tested&&!s.done)return{c:'st-new',t:'Da scoprire'};
  if(meta.terza&&s.m<70)return s.m<35?{c:'st-ter',t:'Novità di terza'}:{c:'st-amb',t:'Ci stai arrivando'};
  if(s.m<35)return{c:'st-red',t:'Da ripartire'};if(s.m<70)return{c:'st-amb',t:'Da rinforzare'};return{c:'st-grn',t:'Ce l’hai'}}
function weakOrder(){return SKILLS.slice().sort((a,b)=>(sk(a.id).m+(a.terza?25:0))-(sk(b.id).m+(b.terza?25:0)))}
function recommended(){if(!testDone())return null;
  for(const s of weakOrder())for(const L of [1,2,3])if(isOpen(s.id,L)&&!lvS(s.id,L))return{id:s.id,L};
  for(const w of Object.keys(WG))if(bossOpen(w)&&!ST.boss[w])return{boss:w};
  for(const s of weakOrder())for(const L of [1,2,3])if(isOpen(s.id,L)&&lvS(s.id,L)<3)return{id:s.id,L};return null}

let AC=null;
function sfx(kind){if(!ST.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const S={ok:[660,880,1320],ko:[300,220],coin:[1046,1568],jump:[520,780],hit:[180,120],win:[523,659,784,1046,1318],star:[880,1175]}[kind]||[660];
  S.forEach((f,i)=>{const t=AC.currentTime+i*.085,o=AC.createOscillator(),g=AC.createGain();o.type=kind==='hit'?'square':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='hit'?.06:.11,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.26);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.3)})}catch(e){}}
const reduced=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n=70){if(reduced())return;const c=document.getElementById('confetti');if(!c)return;const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cs=getComputedStyle(document.documentElement);const cols=['--accent','--lilac','--mint','--sun'].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,s:Math.random()<.5}));let t=0;
  (function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;if(p.s)x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);else{x.beginPath();x.arc(0,0,p.r/2.4,0,7);x.fill()}x.restore()});if(++t<90)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
function toast(msg){const box=document.getElementById('toasts');if(!box)return;while(box.children.length>2)box.firstChild.remove();const d=document.createElement('div');d.className='toast';d.innerHTML=msg;box.appendChild(d);setTimeout(()=>d.remove(),2800)}

/* ---------- motore domande ---------- */
function distractors(q){const a=val(q.ans),out=[];const add=v=>{if(v==null)return;const x=val(v);if(!isFinite(x)||Math.abs(x-a)<1e-9)return;if(a>=0&&x<0)return;if(out.some(o=>Math.abs(val(o)-x)<1e-9))return;out.push(v)};
  (q.traps||[]).forEach(t=>add(t.v));
  if(typeof q.ans==='number'){const c=Number.isInteger(a)?[a+1,a-1,a+2,a*2,a+10,a-10,Math.round(a/2),a-2]:[rnd(a*10),rnd(a/10),rnd(a+.1),rnd(a+1),rnd(a-.1)];shuffle(c).forEach(add)}
  else{const {n,d}=q.ans;[fr(n+1,d),fr(n,d+1),fr(d,n),fr(n*2,d),fr(n,d*2)].forEach(add)}
  return out.slice(0,3)}
function makeQ(id,L,mode){let q,sig;
  for(let i=0;i<14;i++){q=G[id](L);sig=id+'|'+q.text+'|'+(q.math||'')+'|'+(q.choices||[]).join();if(!ST.recent.includes(sig))break}
  ST.recent.push(sig);if(ST.recent.length>300)ST.recent=ST.recent.slice(-300);
  q.skill=id;q.level=L;q.traps=(q.traps||[]).filter(t=>Math.abs(val(t.v)-val(q.ans))>1e-9);q.fmt=q.choices?'choice':'input';
  if(!q.choices){const r=Math.random(),ds=distractors(q);
    if(ds.length===3&&r<(mode==='test'?.15:.22)&&q.req!=='simple'){const opts=shuffle([q.ans,...ds]);q.choices=opts.map(fmt);q.correct=opts.indexOf(q.ans);q.fmt='choice';q.text=q.text.replace(/^Calcola.*$/,'Scegli il risultato giusto.')}
    else if(mode!=='test'&&r<.36&&q.math&&q.eq!==false&&q.req!=='simple'){const w=q.traps.length?q.traps[0].v:ds[0];if(w!=null){q.fmt='bug';q.who=pick(NAMES);q.wrongV=w}}}
  return q}
function parseIn(s){s=String(s).trim().replace(/[−–—]/g,'-').replace(/\s+/g,'');
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');
  s=s.replace(/,/g,'.').replace(/^x=/i,'').replace(/[a-zA-Z€°%²³]+$/,'').replace(/^\+/,'');
  if(s==='')return null;
  const m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);if(m){const n=+m[1],d=+m[2];if(d===0)return{err:'Il denominatore non può essere 0.'};return{v:n/d,frac:true,n,d}}
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s))return{v:+s};
  return{err:'Scrivi solo un numero (es. 12, 3,5, −4 oppure 3/4).'}}
function check(q,p){const a=val(q.ans);const same=(x,y)=>Math.abs(x-y)<1e-6*Math.max(1,Math.abs(y));
  if(same(p.v,a)){
    if(q.req==='simple'){if(!p.frac)return{ok:false,msg:'Scrivila come frazione, per esempio 3/4.',soft:true};if(Number.isInteger(p.n)&&Number.isInteger(p.d)&&gcd(p.n,p.d)!==1)return{ok:false,msg:'Il valore è giusto, ma si può semplificare ancora!',soft:true}}
    if(typeof q.ans!=='number'&&p.frac&&Number.isInteger(p.n)&&Number.isInteger(p.d)&&gcd(p.n,p.d)!==1)return{ok:true,note:'Si poteva semplificare: '+fmt(q.ans)};
    return{ok:true}}
  const t=q.traps.find(t=>same(p.v,val(t.v)));return{ok:false,msg:t?t.msg:null}}

function nextPQ(){const it=PS.queue[PS.idx];const L=PS.type==='mission'?PS.lv[it.id]:it.L;PS.cur={q:makeQ(it.id,L,'play'),tries:0,hints:0,shown:false,done:false}}
function playView(){const c=PS.cur,q=c.q;let head;
  if(PS.type==='boss'){const B=BOSSES[PS.w];head=`<section class="bosscard" id="bosscard"><span class="aura"></span><span class="bossem" id="bossem">${bimg(PS.w)}</span><div class="bossinfo"><b>${B.n}</b><div class="hp"><i style="width:${PS.hp}%"></i></div><span class="hand">“${pick(B.t)}”</span></div></section>`}
  else head=`<div class="lvtitle"><span class="chip">${SK[q.skill].emo} ${PS.type==='mission'?'Missione del giorno':SK[q.skill].name+' · livello '+PS.L}</span><span class="pill coin">🪙 +${PS.coins}</span></div>`;
  return `<div class="stack"><div class="row" style="justify-content:space-between"><button class="btn ghost" data-act="quit">← Mappa</button><span class="combo" aria-live="polite">${PS.combo>=2?'combo ×'+PS.combo+' 🔥':''}</span><span class="pill">${PS.idx+1} / ${PS.queue.length}</span></div>
  <div class="progress">${PS.queue.map((_,i)=>{const r=PS.res[i];return `<i class="${i===PS.idx?'now':r?(r==='auto'?'ok':r==='help'?'help':'ko'):''}"></i>`}).join('')}</div>
  ${head}${qCard(q,PS.type==='boss'?'Attacco':'Esercizio',false)}
  <div class="pet"><span class="petem" id="petem">${ico(ST.pet,'big')}</span><span class="bubble" id="petline">${PS.petLine||pick(['Ci sono io con te!','Se ti blocchi chiedimi un aiutino 💡','Carta e penna, e via!','Con calma, niente timer.'])}</span></div></div>`}
function qCard(q,label,inTest){let body='';
  if(q.fmt==='bug')body=`<p class="qtext">${q.text.startsWith('Calcola')?'':q.text+' '}<b>${q.who}</b> ha scritto questo, ma c’è un errore. Qual è il risultato giusto?</p><div class="math">${q.math} = <span class="wrong">${fmt(q.wrongV)}</span></div>`;
  else body=`<p class="qtext">${q.text}</p>${q.svg?`<div class="fig">${q.svg}</div>`:''}${q.math?`<div class="math">${q.math}${q.eq!==false?' = ?':''}</div>`:''}`;
  const ans=q.fmt==='choice'?`<div class="choices">${q.choices.map((c,i)=>`<button class="choice" data-ch="${i}">${c}</button>`).join('')}</div>`
   :`<div class="answer"><input id="ans" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.ph?esc(q.ph):'La tua risposta'}" aria-label="La tua risposta"><button class="btn primary" data-act="check">${inTest?'Conferma':'Vai!'}</button></div>
     <div class="keys" aria-label="Simboli">${['−','/',','].map(k=>`<button class="key" data-key="${k}" aria-label="Inserisci ${k}">${k}</button>`).join('')}</div>`;
  const acts=inTest?`<div class="actions" id="acts"><button class="btn soft" data-act="skip">🤷 Non lo so</button></div>`
   :`<div class="actions" id="acts"><button class="btn soft" data-act="hint">💡 Aiutino</button><button class="btn soft" data-act="dunno">🤷 Non lo so</button></div>`;
  return `<div class="qwrap"><article class="qcard" id="qcard"><div class="qmeta"><span class="chip">${SK[q.skill].emo} ${SK[q.skill].name}</span><span class="eyebrow">${label} · liv. ${q.level}</span></div>${body}${ans}<div id="fb" class="fb" aria-live="polite"></div><div id="hints" class="hints"></div>${acts}</article></div>`}
function fb(kind,e,html){const el=document.getElementById('fb');if(el){el.className='fb '+kind;el.innerHTML=`<span class="e">${e}</span><span class="t">${html}</span>`}}
function pet(line){PS.petLine=line;const b=document.getElementById('petline'),e=document.getElementById('petem');if(b)b.textContent=line;if(e){e.classList.remove('hop');void e.offsetWidth;e.classList.add('hop')}}
function lockQ(){app().querySelectorAll('#qcard input,#qcard .choice,#qcard .key,#qcard [data-act=check]').forEach(e=>e.disabled=true)}
function showNext(label){const a=document.getElementById('acts');a.innerHTML=`<button class="btn primary big wide" data-act="next" id="nextbtn">${label}</button>`;document.getElementById('nextbtn').focus()}
function addHint(kind){const q=PS.cur.q,h=document.getElementById('hints');
  if(kind==='steps'){h.insertAdjacentHTML('beforeend',`<div class="steps"><span class="lab">${ico(ST.pet,'mini')} ${petName()}: ecco come si fa</span><ol>${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${q.fmt==='choice'?'':`<p style="margin-top:8px">Ora scrivi tu il risultato: <b>${fmt(q.ans)}</b></p>`}</div>`);return}
  h.insertAdjacentHTML('beforeend',`<div class="hint"><span class="lab">${ico(ST.pet,'mini')} ${petName()}: ${kind===1?'ricorda la regola':'primo passo'}</span>${kind===1?q.h1:q.h2}</div>`)}
function useHint(){const c=PS.cur;if(c.done||c.hints>=3)return;c.hints++;
  if(c.hints===1){addHint(1);pet('Ecco la regola che serve 👇')}else if(c.hints===2){addHint(2);pet('Parti da qui, il resto viene da sé')}else{revealSolution();return}updateHintBtn()}
function updateHintBtn(){const b=app().querySelector('[data-act=hint]');if(b)b.innerHTML=PS.cur.hints===0?'💡 Aiutino':PS.cur.hints===1?'💡 Un altro aiutino':'👀 Fammi vedere come si fa'}
function revealSolution(){const c=PS.cur;if(c.shown)return;c.shown=true;c.hints=3;addHint('steps');pet('Guardiamolo insieme, passo passo');
  if(c.q.fmt==='choice'){finishQ('guided');return}
  app().querySelector('[data-act=hint]')?.remove();app().querySelector('[data-act=dunno]')?.remove();focusInput()}
function answerPlay(input,ci){const c=PS.cur,q=c.q;if(c.done)return;let res;
  if(q.fmt==='choice'){res={ok:ci===q.correct};if(!res.ok){const t=q.traps.find(t=>fmt(t.v)===q.choices[ci]);res.msg=t?t.msg:null;const b=app().querySelector(`[data-ch="${ci}"]`);if(b){b.classList.add('no');b.disabled=true}}}
  else{const p=parseIn(input);if(!p)return fb('info','✍️','Scrivi un numero, oppure chiedi un aiutino 💡');if(p.err)return fb('info','✍️',p.err);res=check(q,p)}
  if(res.ok){if(q.fmt==='choice')app().querySelector(`[data-ch="${q.correct}"]`)?.classList.add('yes');finishQ(c.shown?'guided':(c.tries===0&&c.hints===0?'auto':'help'),res.note);return}
  if(res.soft){fb('info','✏️',res.msg);return}
  c.tries++;sfx('ko');const card=document.getElementById('qcard');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');pet(pick(PET_SAD));
  if(PS.type==='boss'&&c.tries===1){const be=document.getElementById('bossem');be&&floatTxt(be.parentElement,'ah ah!','boss')}
  if(c.shown){fb('bad','🙈',`Quasi: la risposta giusta è ${fmt(q.ans)}. Scrivila e andiamo avanti.`);return}
  const msg=res.msg?`<b>Occhio!</b> ${res.msg}`:pick(SOFT);
  if(c.tries===1){fb('bad','🤔',msg);if(c.hints<1){c.hints=1;addHint(1);updateHintBtn()}}
  else if(c.tries===2){fb('bad','🤔',msg+' Ecco un altro aiuto.');if(c.hints<2){if(c.hints<1)addHint(1);c.hints=2;addHint(2);updateHintBtn()}}
  else{fb('bad','💜','Ok, vediamolo insieme passo passo.');revealSolution()}
  document.getElementById('ans')?.select()}
function finishQ(kind,note){const c=PS.cur,q=c.q,id=q.skill,s=sk(id);c.done=true;PS.res[PS.idx]=kind;s.done++;s.last=today();activity();
  const cap=[0,50,80,100][q.level];let coins=0,x=0;
  if(kind==='auto'){s.auto++;const gain=4+3*q.level;s.m=s.m<cap?Math.min(cap,s.m+gain):Math.min(100,s.m+1);PS.combo++;coins=5+(PS.combo>=3?2:0);x=10*q.level+(PS.combo>=3?Math.min(PS.combo,10):0);
    if(PS.combo===5)award('combo5');if(PS.combo===10)award('combo10');
    fb('good','✨',pick(GOOD)+(note?` <span class="muted">${note}</span>`:''));sfx('ok');confetti(PS.combo>=5?90:40);pet(PS.combo>=3?'Combo ×'+PS.combo+'! Sei on fire 🔥':pick(PET_CHEER));
    if(PS.type==='mission'){PS.streakBy[id]=(PS.streakBy[id]||0)+1;if(PS.streakBy[id]>=2&&PS.lv[id]<3){PS.lv[id]++;PS.streakBy[id]=0;setTimeout(()=>toast('⬆️ Si sale: ora livello '+PS.lv[id]),400)}}}
  else if(kind==='help'){s.helped++;s.m=Math.min(s.m<cap?cap:100,s.m+2);PS.combo=0;coins=2;x=4;ST.braveCount++;if(ST.braveCount>=5)award('brave');fb('good','💡',pick(GOOD_HELP)+(note?` <span class="muted">${note}</span>`:''));sfx('ok');pet('Visto? Un aiutino e via!');if(PS.type==='mission')PS.streakBy[id]=0}
  else{s.guided++;s.m=Math.max(0,s.m-4);PS.combo=0;coins=1;x=2;if(PS.type==='mission'){PS.streakBy[id]=0;PS.lv[id]=Math.max(1,PS.lv[id]-1)}
    if(PS.inserted<2){PS.queue.splice(PS.idx+1,0,{...PS.queue[PS.idx]});PS.inserted++;fb('info','💜','Ora che hai visto come si fa, ti propongo <b>uno simile</b> da fare da sola.')}else fb('info','💜','Va bene così: l’importante è aver capito il procedimento.')}
  PS.coins+=coins;PS.xp+=x;addXp(x);addCoins(coins);floatTxt(document.getElementById('qcard'),`+${coins} 🪙`);
  if(PS.type==='boss'&&kind!=='guided'){const dmg=kind==='auto'?(q.level>=2?22:18):9;PS.hp=Math.max(0,PS.hp-dmg);const bar=app().querySelector('.hp i');if(bar)bar.style.width=PS.hp+'%';const be=document.getElementById('bossem');if(be){be.classList.remove('hit');void be.offsetWidth;be.classList.add('hit');floatTxt(be.parentElement,'−'+dmg,'dmg')}sfx('hit')}
  save();lockQ();updateCombo();
  const last=PS.idx+1>=PS.queue.length||(PS.type==='boss'&&PS.hp<=0);
  showNext(PS.type==='boss'&&PS.hp<=0?'Colpo finale! 🏆':last?'Vedi il risultato →':'Avanti →')}
function updateCombo(){const el=app().querySelector('.combo');if(el)el.textContent=PS.combo>=2?'combo ×'+PS.combo+' 🔥':''}
function nextPlay(){PS.idx++;if(PS.idx>=PS.queue.length||(PS.type==='boss'&&PS.hp<=0)){endPlay();return}nextPQ();render()}
function endPlay(){const n=PS.res.length,a=PS.res.filter(r=>r==='auto').length,h=PS.res.filter(r=>r==='help').length,g=PS.res.filter(r=>r==='guided').length;
  const R={a,h,g,n,bonus:0,stars:0,prev:0,win:false};
  if(PS.type==='level'){R.stars=a>=LEVEL_Q-1?3:a>=Math.ceil(LEVEL_Q/2)?2:1;ST.lv[PS.id]=ST.lv[PS.id]||{};R.prev=ST.lv[PS.id][PS.L]||0;if(R.stars>R.prev){ST.lv[PS.id][PS.L]=R.stars;R.bonus=10*(R.stars-R.prev)}if(a===n)award('perfect')}
  if(PS.type==='boss'){R.win=PS.hp<=0;if(R.win){R.stars=g===0&&h<=1?3:g===0?2:1;R.prev=ST.boss[PS.w]||0;if(R.stars>R.prev)ST.boss[PS.w]=R.stars;R.bonus=R.prev?10:60;award('boss1');if(Object.keys(WG).every(w=>ST.boss[w]))award('bossall')}}
  if(PS.type==='mission'){R.stars=a>=6?3:a>=4?2:1;if(ST.missionDay!==today()){ST.missionDay=today();R.bonus=30;award('goal')}}
  if(R.bonus){addCoins(R.bonus);PS.coins+=R.bonus}
  if(totalStars()>=30)award('stars30');
  ST.sessions.push({d:today(),type:PS.type,skills:Object.keys(PS.startM),auto:a,help:h,guided:g,n});if(ST.sessions.length>80)ST.sessions=ST.sessions.slice(-80);
  PS.R=R;save();if(R.stars>=2||R.win){confetti(140);sfx('win')}go('result')}
function resultView(){const R=PS.R;let title,sub,next='';
  if(PS.type==='boss'){const B=BOSSES[PS.w];title=R.win?`Hai battuto ${B.n}! 🏆`:`${B.n} è scappato!`;sub=R.win?'Isola conquistata. Il boss se ne torna a casa sconfitto.':`Gli restano ${PS.hp} HP. Allenati sui livelli dell’isola e ritenta: ogni volta gli fai più male.`}
  else if(PS.type==='mission'){title=R.a>=6?'Missione stellare ✨':'Missione compiuta!';sub='Hai allenato i tuoi punti deboli: è la cosa che fa crescere di più.'}
  else{title=R.stars===3?'Livello perfetto 💅':R.stars===2?'Livello superato!':'Livello completato 🌱';sub=R.stars<3?'Rigiocalo quando vuoi per prendere tutte le stelle.':'Tutte le stelle prese!';
    if(PS.L<3&&isOpen(PS.id,PS.L+1))next=`<button class="btn primary big" data-act="nextLevel">Livello ${PS.L+1} →</button>`}
  const showStars=PS.type!=='boss'||R.win;
  return `<div class="stack"><section class="card stack resultcard">${showStars?`<div class="bigstars">${[1,2,3].map(i=>`<span class="${i<=R.stars?'on':''}" style="animation-delay:${i*.18}s">★</span>`).join('')}</div>`:`<div class="bosshero small">${bimg(PS.w)}</div>`}
  <h1>${title}</h1><p>${sub}</p>
  <div class="stat"><div><b>${R.a}</b><span>da sola ✨</span></div><div><b>${R.h}</b><span>con aiutino 💡</span></div><div><b>${R.g}</b><span>visti insieme 👀</span></div></div>
  <div class="row" style="justify-content:center"><span class="pill coin big">🪙 +${PS.coins}</span><span class="pill big">✨ +${PS.xp} XP</span>${R.bonus?`<span class="pill big">🎁 bonus +${R.bonus}</span>`:''}</div></section>
  <div class="row">${next}<button class="btn ${next?'':'primary big'}" data-act="replay">Rigioca</button><button class="btn" data-act="map">Mappa</button></div></div>`}

function shopView(){const tabs=[['av','Avatar'],['pet','Compagni'],['th','Temi']];let items='';
  if(SHOPTAB==='av')items=AVATARS.map(([e,p])=>shopItem('av',e,ico(e),PHOTOS[e]?(e==='lulu'?'Lulù':'Mirtillo'):'',p,ST.avatar===e)).join('');
  if(SHOPTAB==='pet')items=PETS.map(([e,n,p])=>shopItem('pet',e,ico(e),n,p,ST.pet===e)).join('');
  if(SHOPTAB==='th')items=THEMES.map(t=>shopItem('th',t.id,`<span class="sw">${t.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</span>`,t.name,t.p,ST.theme===t.id)).join('');
  return `<div class="stack"><section class="card stack"><p class="eyebrow">Negozio</p><h1>Spendi le tue monete 🛍️</h1><p class="muted">Guadagni monete con ogni esercizio, con le stelle, con i boss e con la missione del giorno. Gli aiutini sono sempre gratis.</p>
  <div class="tabs" role="tablist">${tabs.map(([k,n])=>`<button role="tab" aria-selected="${SHOPTAB===k}" data-tab="${k}">${n}</button>`).join('')}</div></section>
  <div class="shop">${items}</div></div>
  <nav class="dock"><button data-act="map">🗺️<span>Mappa</span></button><button data-act="shop" class="on">🛍️<span>Negozio</span></button><button data-act="settings">⚙️<span>Profilo</span></button></nav>`}
function shopItem(kind,id,vis,name,price,eq){const own=ST.own[kind].includes(id);
  return `<div class="item ${eq?'eq':''}"><span class="iv">${vis}</span>${name?`<b>${name}</b>`:''}${eq?'<span class="status st-grn">In uso</span>':own?`<button class="btn soft" data-equip="${kind}" data-id="${id}">Usa</button>`:`<button class="btn ${ST.coins>=price?'primary':''}" data-buy="${kind}" data-id="${id}" data-p="${price}" ${ST.coins>=price?'':'disabled'}>🪙 ${price}</button>`}</div>`}
function buy(kind,id,p){if(ST.coins<p)return;ST.coins-=p;ST.own[kind].push(id);equip(kind,id);sfx('coin');confetti(60);toast('Sbloccato! ✨')}
function equip(kind,id){if(kind==='av')ST.avatar=id;if(kind==='pet'){ST.pet=id;ST.petSet=true}if(kind==='th')ST.theme=id;save();render()}

function settingsSheet(){return `<div class="stack"><div class="row" style="justify-content:space-between"><h2>Profilo</h2><button class="iconbtn" data-act="close" aria-label="Chiudi">✕</button></div>

function renderModal(){let m=document.querySelector('.modal');if(!MODAL){m&&m.remove();return}
  if(!m){m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m){MODAL=null;renderModal()}})}
  m.innerHTML=`<div class="sheet">${MODAL.type==='node'?nodeSheet(MODAL.id):MODAL.type==='boss'?bossSheet(MODAL.w):settingsSheet()}</div>`;

  <div class="stat"><div><b>${ST.total}</b><span>esercizi totali</span></div><div><b>${days7}</b><span>ultimi 7 giorni</span></div><div><b>${Object.keys(ST.days).length}</b><span>giorni di pratica</span></div></div>
  <p class="muted" style="font-size:.92rem">“Da sola” = risposta giusta al primo colpo senza aiuti. Il punteggio 0–100 sale solo con risposte autonome, di più ai livelli alti; le risposte guidate non lo gonfiano. Le stelle dei livelli seguono la stessa logica. Il check-in è un orientamento: un singolo errore non è una diagnosi.</p></section>
  <section class="card stack"><h3>Argomenti</h3><div class="tw"><table class="t"><thead><tr><th>Argomento</th><th>Stato</th><th>Punteggio</th><th>Livelli</th><th>Esercizi</th><th>Da sola</th></tr></thead><tbody>
  ${SKILLS.map(s=>{const x=sk(s.id),tot=x.auto+x.helped+x.guided;return `<tr><td>${s.emo} ${s.name}</td><td><span class="status ${status(s.id).c}">${status(s.id).t}</span></td><td><span class="meter"><i style="width:${x.m}%"></i></span> ${x.m}</td><td>${[1,2,3].map(L=>lvS(s.id,L)).join(' · ')}</td><td>${tot}</td><td>${tot?Math.round(x.auto/tot*100)+'%':'—'}</td></tr>`}).join('')}
  </tbody></table></div></section>
  <section class="card stack"><h3>Ultime partite</h3>${last.length?last.map(s=>`<div class="row" style="justify-content:space-between"><span>${s.d} · ${tl[s.type]||''} ${(s.skills||[]).map(id=>SK[id]?SK[id].emo:'').join(' ')}</span><span class="muted">${s.auto} da sola · ${s.help} con aiuto · ${s.guided} guidati</span></div>`).join(''):'<p class="muted">Ancora nessuna partita.</p>'}</section>
  <section class="card stack"><h3>Report da copiare</h3><textarea class="txt" id="rep" readonly>${esc(report())}</textarea><button class="btn" data-act="copyRep">Copia report</button></section>
  <section class="card stack"><h3>Backup dei progressi</h3><p class="muted">I progressi restano in questo browser. Per spostarli su un altro dispositivo copia il codice e incollalo dall’altra parte.</p>
  <textarea class="txt" id="bk" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(ST))))}</textarea><button class="btn" data-act="copyBk">Copia codice</button>
  <label class="f" for="imp">Incolla un codice per ripristinare<textarea class="txt" id="imp" placeholder="Incolla qui il codice di backup"></textarea></label><button class="btn" data-act="importBk">Ripristina</button><div id="impmsg" class="muted"></div></section>
  <section class="card stack"><h3>Ricomincia da zero</h3><button class="btn danger" data-act="reset">${RESET_ARM?'Sicuro? Premi di nuovo per cancellare tutto':'Cancella tutti i progressi'}</button></section>
  <button class="btn" data-act="map">← Torna alla mappa</button></div>`}
function copyText(id,btn){const el=document.getElementById(id);try{navigator.clipboard.writeText(el.value).then(()=>btn.textContent='Copiato ✓',()=>{el.select();btn.textContent='Selezionato: copia con Ctrl/Cmd+C'})}catch(e){el.select()}}

/* ---------- eventi ---------- */
function focusInput(){const i=document.getElementById('ans');if(i&&!i.disabled&&window.matchMedia('(pointer:fine)').matches)i.focus({preventScroll:true})}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.key){const i=document.getElementById('ans');if(!i||i.disabled)return;const k=t.dataset.key==='−'?'-':t.dataset.key;const s=i.selectionStart??i.value.length,en=i.selectionEnd??i.value.length;i.value=i.value.slice(0,s)+k+i.value.slice(en);i.focus();i.setSelectionRange(s+1,s+1);return}
  if(t.dataset.gc!=null){gChoose(+t.dataset.gc);return}
  if(t.dataset.ch!=null){const n=+t.dataset.ch;SCREEN==='test'?answerTest(null,n):answerPlay(null,n);return}
  if(t.dataset.node){const id=t.dataset.node,L=+t.dataset.l;if(!testDone()){toast('🌫️ Prima scopri la mappa con il check-in');return}if(!isOpen(id,L)){toast('🔒 Prima completa il livello '+(L-1));return}MODAL={type:'node',id,L};renderModal();return}
  if(t.dataset.boss){const w=t.dataset.boss;if(!bossOpen(w)){toast(testDone()?'🔒 Supera il livello 1 di ogni argomento dell’isola':'🌫️ Prima scopri la mappa');return}MODAL={type:'boss',w};renderModal();return}
  if(t.dataset.pl){MODAL.L=+t.dataset.pl;renderModal();return}
  if(t.dataset.tab){SHOPTAB=t.dataset.tab;render();return}
  if(t.dataset.buy){buy(t.dataset.buy,t.dataset.id,+t.dataset.p);return}
  if(t.dataset.equip){equip(t.dataset.equip,t.dataset.id);return}
  const a=t.dataset.act;if(!a)return;
  switch(a){
   case'map':MODAL=null;go('map');break;
   case'shop':MODAL=null;go('shop');break;
   case'testIntro':go('testIntro');break;
   case'startTest':startTest();break;
   case'resumeTest':nextTestQ();go('test');break;
   case'pauseTest':save();go('map');break;
   case'skip':answerTest('skip');break;
   case'check':{const v=document.getElementById('ans').value;SCREEN==='test'?answerTest(v):answerPlay(v);break}
   case'next':if(SCREEN==='test'){if(ST.test.i>=TEST_ORDER.length&&!ST.test.pending)finishTest();else{nextTestQ();render()}}else nextPlay();break;
   case'hint':useHint();break;
   case'ghint':gHint();break;
   case'ghclose':{const b=document.getElementById('ghints');if(b)b.hidden=true;break}
   case'dunno':{const c=PS.cur;if(c.hints<2){if(c.hints<1)addHint(1);addHint(2);c.hints=2;updateHintBtn();fb('info','💜','Nessun problema! Leggi questi due aiuti e prova. Se resti bloccata, premi “Fammi vedere come si fa”.');pet('Ci pensiamo insieme 💜')}else revealSolution();break}
   case'play':startLevel(t.dataset.id,+t.dataset.l);break;
   case'fight':startBoss(t.dataset.w);break;
   case'mission':startMission();break;
   case'nextLevel':startLevel(PS.id,PS.L+1);break;
   case'replay':PS.type==='level'?startLevel(PS.id,PS.L):PS.type==='boss'?startBoss(PS.w):startMission();break;
   case'quit':go('map');break;
   case'settings':MODAL={type:'settings'};renderModal();break;
   case'close':MODAL=null;renderModal();break;
   case'parents':RESET_ARM=false;go('parents');break;
   case'copyRep':copyText('rep',t);break;
   case'copyBk':copyText('bk',t);break;
   case'importBk':{try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('imp').value.trim()))));if(o&&o.v===1){ST=Object.assign(blank(),o);save();go('map');toast('Progressi ripristinati ✓')}else throw 0}catch(err){document.getElementById('impmsg').textContent='Il codice non è valido: controlla di averlo copiato tutto.'}break}
   case'reset':if(!RESET_ARM){RESET_ARM=true;render()}else{ST=blank();save();RESET_ARM=false;MODAL=null;SCREEN='map';render()}break;
  }});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL){MODAL=null;renderModal();return}
  if(e.key!=='Enter')return;if(e.target&&e.target.id==='ans'){e.preventDefault();const b=app().querySelector('[data-act=check]');b&&!b.disabled&&b.click();return}
  const n=document.getElementById('nextbtn');if(n&&(e.target===document.body||e.target===n)){e.preventDefault();n.click()}});

render();

</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!window.__mcReloaded){window.__mcReloaded=1;location.reload()}}))}</script></body></html>
